function saveTank(id){
  if(id?!can('tanks_edit'):!can('tanks_add')){toast('ليس لديك صلاحية','error');return;}
  const name=document.getElementById('tkn').value.trim();if(!name){toast('أدخل الاسم','error');return;}
  const cap=parseFloat(document.getElementById('tkc').value)||0,cur=parseFloat(document.getElementById('tkcur').value)||0;
  if(cur>cap){toast('الكمية الحالية لا تتجاوز السعة','error');return;}
  const data={name,fuelType:document.getElementById('tkf').value,capacity:cap,currentLevel:cur,alertPct:parseInt(document.getElementById('tka').value,10)||20};
  if(id)DB.update('tanks',id,data);else DB.add('tanks',data);
  toast(id?'تم التحديث':'تمت الإضافة');closeModal();renderTanks();
}
function openTankFillModal(tankId){
  const tk=DB.find('tanks',tankId);if(!tk)return;
  const pct=tk.capacity>0?Math.min(100,Math.round(tk.currentLevel/tk.capacity*100)):0;
  const cls=pct>50?'tf-green':pct>20?'tf-yellow':'tf-red';
  openModal(`تعبئة تانكي: ${esc(tk.name)}`,`
    <div style="background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:14px">
      <div style="font-size:13px">الكمية الحالية: <strong>${fmtNum(tk.currentLevel)}</strong> من <strong>${fmtNum(tk.capacity)} لتر</strong></div>
      <div class="tank-bar mt-1"><div class="tank-fill ${cls}" style="width:${pct}%"></div></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>الكمية المضافة (لتر) <span class="req">*</span></label>
        <input class="form-control" type="number" id="tfl" min="0.01" step="0.01" oninput="chkTankFill(${tk.capacity},${tk.currentLevel});calcTankCost()">
        <div class="form-hint">المساحة المتبقية: <strong>${fmtNum(tk.capacity-tk.currentLevel)}</strong> لتر</div>
        <div class="form-hint" id="tfcost"></div></div>
      <div class="form-group"><label>التاريخ</label><input class="form-control" type="date" id="tfd" value="${today()}"></div>
    </div>
    <div class="form-group"><label>سعر الليتر (ر.س)</label>
      <input class="form-control" type="number" id="tfp" min="0" step="0.01" placeholder="مثال: 0.75" oninput="calcTankCost()">
      <div class="form-hint">اتركه فارغاً لاستخدام سعر النظام</div></div>
    <div id="tfw" style="display:none;color:var(--danger);font-size:13px;margin-bottom:8px"></div>
    <div class="form-group"><label>ملاحظات</label><textarea class="form-control" id="tfn"></textarea></div>`,
    'تأكيد',()=>saveTankFill(tankId));
}
function chkTankFill(cap,cur){
  const l=parseFloat(document.getElementById('tfl').value)||0,w=document.getElementById('tfw');
  if(cur+l>cap){w.style.display='block';w.textContent=`⚠️ ستتجاوز السعة (${fmtNum(cap)} لتر)`;} else w.style.display='none';
}
function calcTankCost(){
  const l=parseFloat(document.getElementById('tfl')?.value)||0;
  const p=parseFloat(document.getElementById('tfp')?.value)||0;
  const el=document.getElementById('tfcost');
  if(el&&l>0&&p>0)el.textContent=`التكلفة الإجمالية: ${fmtNum((l*p).toFixed(2))} ر.س`;
  else if(el)el.textContent='';
}
function saveTankFill(tankId){
  if(!can('tanks_edit')&&!isOwner()){toast('ليس لديك صلاحية','error');return;}
  const liters=parseFloat(document.getElementById('tfl').value)||0;
  if(liters<=0){toast('أدخل كمية صحيحة','error');return;}
  if(!document.getElementById('tfd').value){toast('أدخل التاريخ','error');return;}
  const tk=DB.find('tanks',tankId);
  if(liters>tk.capacity-tk.currentLevel){toast(`الكمية (${liters}L) تتجاوز السعة المتبقية (${fmtNum(tk.capacity-tk.currentLevel)}L)`,'error');return;}
  const balanceBefore=tk.currentLevel;
  const newLevel=Math.min(tk.capacity,tk.currentLevel+liters);
  DB.update('tanks',tankId,{currentLevel:newLevel});
  const fill=DB.add('tankFills',{tankId,liters,date:document.getElementById('tfd').value,notes:document.getElementById('tfn').value.trim(),
    pricePerLiter:parseFloat(document.getElementById('tfp').value)||null,
    totalCost:parseFloat(document.getElementById('tfp').value)&&parseFloat(document.getElementById('tfl').value)
      ?(parseFloat(document.getElementById('tfl').value)*parseFloat(document.getElementById('tfp').value)).toFixed(2)
      :null,
    userId:currentUser.id,userName:currentUser.name});
  logFuelMovement(tankId,'fill',liters,balanceBefore,newLevel,'tank_fill',fill.id);
  logAct('تعبئة تانكي',`${tk.name} +${liters}L → ${fmtNum(newLevel)}L`);
  toast(`✅ رصيد التانكي الجديد: ${fmtNum(newLevel)} لتر`);closeModal();renderTanks();
}
function confirmDelTank(id){
  const tk=DB.find('tanks',id);
  confirm2(`حذف تانكي "${tk?.name}"؟`,()=>{DB.del('tanks',id);toast('تم الحذف');renderTanks();});
}

/* ============================================================
   TANK-TO-TANK TRANSFER
   ============================================================ */
function openTankTransferModal(fromTankId){
  if(!can('tanks_edit')){toast('ليس لديك صلاحية','error');return;}
  const tanks=DB.all('tanks');
  if(tanks.length<2){toast('تحتاج تانكيين على الأقل للتحويل','error');return;}
  // Build source options
  const fromOpts=tanks.map(tk=>`<option value="${tk.id}"${fromTankId===tk.id?' selected':''}>${esc(tk.name)} — ${fmtNum(tk.currentLevel)} لتر / ${fmtNum(tk.capacity)} لتر</option>`).join('');
  // Build dest options (all tanks, onchange will exclude selected source)
  const toOpts=tanks.filter(tk=>tk.id!==fromTankId).map(tk=>`<option value="${tk.id}">${esc(tk.name)} — متبقٍ: ${fmtNum(tk.capacity-tk.currentLevel)} لتر</option>`).join('');
  openModal('🔄 تحويل وقود بين التانكيات',`
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;margin-bottom:4px">
      <div class="form-group" style="margin:0">
        <label>من تانكي <span class="req">*</span></label>
        <select class="form-control" id="ttr_from" onchange="onTankTransferFromCh()">${fromOpts}</select>
        <div class="form-hint" id="ttr_from_info" style="margin-top:4px"></div>
      </div>
      <div style="padding-top:28px;font-size:22px;color:var(--accent);text-align:center">→</div>
      <div class="form-group" style="margin:0">
        <label>إلى تانكي <span class="req">*</span></label>
        <select class="form-control" id="ttr_to" onchange="onTankTransferToCh()">${toOpts||'<option value="">لا يوجد تانكي آخر</option>'}</select>
        <div class="form-hint" id="ttr_to_info" style="margin-top:4px"></div>
      </div>
    </div>
    <div class="form-row" style="margin-top:12px">
      <div class="form-group">
        <label>الكمية (لتر) <span class="req">*</span></label>
        <input class="form-control" type="number" id="ttr_qty" min="0.01" step="0.01" placeholder="0.00" oninput="onTankTransferQtyInput()">
        <div class="form-hint" id="ttr_qty_hint" style="margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label>التاريخ</label>
        <input class="form-control" type="date" id="ttr_date" value="${today()}">
      </div>
    </div>
    <div class="form-group">
      <label>ملاحظات</label>
      <textarea class="form-control" id="ttr_notes" rows="2"></textarea>
    </div>`,
    'تأكيد التحويل',()=>saveTankTransfer());
  setTimeout(()=>{onTankTransferFromCh();onTankTransferToCh();},80);
}

function onTankTransferFromCh(){
  const fromId=document.getElementById('ttr_from')?.value;
  const toSel=document.getElementById('ttr_to');
  const fromInfo=document.getElementById('ttr_from_info');
  const fromTk=fromId?DB.find('tanks',fromId):null;
  // Update from-info
  if(fromInfo&&fromTk){
    const pct=fromTk.capacity>0?Math.round(fromTk.currentLevel/fromTk.capacity*100):0;
    fromInfo.innerHTML=`الرصيد: <strong>${fmtNum(fromTk.currentLevel)} لتر</strong> (${pct}%)`;
  }
  // Rebuild dest options excluding selected source
  if(toSel&&fromId){
    const prevTo=toSel.value;
    const tanks=DB.all('tanks');
    toSel.innerHTML=tanks.filter(t=>t.id!==fromId)
      .map(t=>`<option value="${t.id}"${prevTo===t.id?' selected':''}>${esc(t.name)} — متبقٍ: ${fmtNum(t.capacity-t.currentLevel)} لتر</option>`).join('');
    if(!toSel.value&&toSel.options.length)toSel.selectedIndex=0;
    onTankTransferToCh();
  }
  onTankTransferQtyInput();
}

function onTankTransferToCh(){
  const toId=document.getElementById('ttr_to')?.value;
  const toInfo=document.getElementById('ttr_to_info');
  const toTk=toId?DB.find('tanks',toId):null;
  if(toInfo&&toTk){
    toInfo.innerHTML=`الرصيد: <strong>${fmtNum(toTk.currentLevel)} لتر</strong> — المساحة المتبقية: <strong>${fmtNum(toTk.capacity-toTk.currentLevel)} لتر</strong>`;
  }
  onTankTransferQtyInput();
}

function onTankTransferQtyInput(){
  const fromId=document.getElementById('ttr_from')?.value;
  const toId=document.getElementById('ttr_to')?.value;
  const qty=parseFloat(document.getElementById('ttr_qty')?.value)||0;
  const hint=document.getElementById('ttr_qty_hint');
  if(!hint)return;
  const fromTk=fromId?DB.find('tanks',fromId):null;
  const toTk=toId?DB.find('tanks',toId):null;
  if(!fromTk||!toTk||qty<=0){hint.innerHTML='';return;}
  const newFrom=fromTk.currentLevel-qty;
  const overflow=(toTk.currentLevel+qty)-toTk.capacity;
  if(qty>fromTk.currentLevel){
    hint.innerHTML=`<span style="color:var(--danger)">⚠️ الكمية تتجاوز رصيد "${esc(fromTk.name)}" (${fmtNum(fromTk.currentLevel)} لتر)</span>`;
  } else if(overflow>0){
    hint.innerHTML=`<span style="color:var(--warning)">⚠️ ستتجاوز سعة "${esc(toTk.name)}" بـ ${fmtNum(overflow)} لتر — الحد المسموح: ${fmtNum(toTk.capacity-toTk.currentLevel)} لتر</span>`;
  } else {
    const newTo=toTk.currentLevel+qty;
    hint.innerHTML=`<span style="color:var(--success)">✅ بعد التحويل: ${esc(fromTk.name)} → <strong>${fmtNum(newFrom)} لتر</strong> | ${esc(toTk.name)} → <strong>${fmtNum(newTo)} لتر</strong></span>`;
  }
}

function saveTankTransfer(){
  if(!can('tanks_edit')){toast('ليس لديك صلاحية','error');return;}
  const fromId=document.getElementById('ttr_from').value;
  const toId=document.getElementById('ttr_to').value;
  const qty=parseFloat(document.getElementById('ttr_qty').value)||0;
  const date=document.getElementById('ttr_date').value;
  const notes=document.getElementById('ttr_notes').value.trim();
  if(!fromId||!toId){toast('اختر التانكيين','error');return;}
  if(fromId===toId){toast('المصدر والهدف نفس التانكي!','error');return;}
  if(qty<=0){toast('أدخل كمية صحيحة','error');return;}
  if(!date){toast('أدخل التاريخ','error');return;}
  const fromTk=DB.find('tanks',fromId),toTk=DB.find('tanks',toId);
  if(!fromTk||!toTk){toast('تانكي غير موجود','error');return;}
  if(qty>fromTk.currentLevel){toast(`الكمية (${fmtNum(qty)}L) تتجاوز رصيد "${fromTk.name}" (${fmtNum(fromTk.currentLevel)}L)`,'error');return;}
  if(toTk.currentLevel+qty>toTk.capacity){toast(`الكمية تتجاوز السعة المتبقية في "${toTk.name}" (${fmtNum(toTk.capacity-toTk.currentLevel)}L)`,'error');return;}
  const fromBefore=fromTk.currentLevel,toBefore=toTk.currentLevel;
  const fromAfter=fromBefore-qty,toAfter=toBefore+qty;
  // Update both tanks
  DB.update('tanks',fromId,{currentLevel:fromAfter});
  DB.update('tanks',toId,{currentLevel:toAfter});
  // Log movements for both tanks
  logFuelMovement(fromId,'transfer_out',qty,fromBefore,fromAfter,'tank_transfer',toId);
  logFuelMovement(toId,'transfer_in',qty,toBefore,toAfter,'tank_transfer',fromId);
  // Save transfer record
  DB.add('tankTransfers',{fromTankId:fromId,fromTankName:fromTk.name,toTankId:toId,toTankName:toTk.name,
    liters:qty,date,fromBefore,fromAfter,toBefore,toAfter,
    notes,userId:currentUser.id,userName:currentUser.name});
  logAct('تحويل وقود بين تانكيات',`${fromTk.name} → ${toTk.name}: ${fmtNum(qty)}L`);
  toast(`✅ تم تحويل ${fmtNum(qty)} لتر من "${fromTk.name}" إلى "${toTk.name}"`);
  closeModal();renderTanks();
}

  const sel=document.getElementById('fm_tk');
  let opts='';
  if(fuelSrc!=='tank')opts+=`<option value="">⛽ من المحطة (خارجي)</option>`;
  if(fuelSrc!=='station')opts+=mt.map(tk=>`<option value="${tk.id}">🛢️ ${esc(tk.name)} — ${fmtNum(tk.currentLevel)} لتر</option>`).join('');
  sel.innerHTML=opts;
  // Auto-select last tank used for this vehicle
  if(v){
    const lastTkId=DB.all('fuel').filter(f=>f.vehicleId===v.id&&f.tankId).sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt))[0]?.tankId;

  const badge=document.getElementById('fm_src_badge');

    const srcColors={tank:'#eafaf1',station:'#fef3e7',both:'#ebf5fb'};

    badge.style.background=srcColors[fuelSrc]||'#ebf5fb';
    badge.textContent=v?srcLabels[fuelSrc]||'':'';
    badge.style.display=v?'block':'none';
  }

    const vRecs=DB.all('fuel').filter(f=>f.vehicleId===v.id).sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));
    const lastOdo=vRecs.find(f=>f.odometer)?.odometer;

    if(hint)hint.textContent=lastOdo?`آخر قراءة: ${fmtNum(lastOdo)} كم`:'لا توجد قراءة سابقة';

      const lf=vRecs[0];
      lastFillEl.innerHTML=lf?`آخر تعبئة لهذه السيارة: <strong>${fmtNum(lf.quantity)}</strong> لتر`:'';

}
function onFuelTkCh(){
  const tkId=document.getElementById('fm_tk').value,info=document.getElementById('fm_tki');
  if(!tkId){info.style.display='none';return;}
  const tk=DB.find('tanks',tkId);if(!tk){info.style.display='none';return;}
  const pct=tk.capacity>0?Math.round((tk.currentLevel/tk.capacity)*100):0;
  const cls=pct>50?'tf-green':pct>20?'tf-yellow':'tf-red';
  info.style.display='block';
  info.innerHTML=`🛢️ <strong>${esc(tk.name)}</strong> — الرصيد: <strong style="color:${pct>20?'var(--success)':'var(--danger)'}">${fmtNum(tk.currentLevel)} لتر</strong> (${pct}%)`;
}
function calcFuelCost(){
  const v=DB.find('vehicles',document.getElementById('fm_v')?.value);
  const qty=parseFloat(document.getElementById('fm_q')?.value)||0;
  const costEl=document.getElementById('fm_c'),hint=document.getElementById('fm_ph');
  if(!v||qty<=0){if(costEl)costEl.value='';if(hint)hint.textContent='';return;}
  const price=fuelPrice(v.fuelType);const cost=(qty*price).toFixed(2);
  if(costEl)costEl.value=cost;
  if(hint)hint.textContent=`سعر اللتر الحالي: ${price} ر.س × ${qty} لتر = ${cost} ر.س`;
}
function saveFuelRec(id){
  const vehicleId=document.getElementById('fm_v').value;
  const date=document.getElementById('fm_d').value;
  const qty=parseFloat(document.getElementById('fm_q').value)||0;
  const cost=parseFloat(document.getElementById('fm_c').value)||0;
  const tankId=document.getElementById('fm_tk').value;
  if(!vehicleId){toast('اختر السيارة','error');return;}
  if(!date){toast('اختر التاريخ','error');return;}
  if(qty<=0){toast('أدخل كمية صحيحة','error');return;}
  if(tankId){
    const tk=DB.find('tanks',tankId);
    if(tk&&qty>tk.currentLevel){toast(`الكمية (${qty}L) أكبر من رصيد التانكي (${fmtNum(tk.currentLevel)}L)`,'error');return;}
  }
  // Historical price: keep original when editing, save current when adding
  const existingRec=id?DB.find('fuel',id):null;
  const v=DB.find('vehicles',vehicleId);
  const pricePerLiter=existingRec?.pricePerLiter||fuelPrice(v?.fuelType||'ديزل');
  // Odometer + distance
  const _odoRaw=document.getElementById('fm_odo').value.trim();
  const odometer=_odoRaw===''?null:parseInt(_odoRaw,10)||null;
  let distance=null,prevOdometer=null;
  if(odometer&&!id){
    const lastRec=DB.all('fuel').filter(f=>f.vehicleId===vehicleId&&f.odometer).sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt))[0];
    if(lastRec?.odometer){prevOdometer=lastRec.odometer;distance=odometer-prevOdometer;}
  } else if(id&&existingRec){prevOdometer=existingRec.prevOdometer;distance=existingRec.distance;}
  const data={vehicleId,date,quantity:qty,cost,pricePerLiter,tankId:tankId||null,
    projectId:document.getElementById('fm_pr').value||null,
    fillTime:document.getElementById('fm_t').value||null,
    odometer,prevOdometer,distance,
    approvalStatus:'pending',
    ...(id&&existingRec?.approvedBy?{approvedBy:null,approvedByName:null,approvedAt:null}:{}),
    notes:document.getElementById('fm_n').value.trim(),userId:currentUser.id,userName:currentUser.name};
  if(id){
    // Restore old tank balance + log
    const old=DB.find('fuel',id);
    if(old?.tankId){
      const otk=DB.find('tanks',old.tankId);
      if(otk){const restored=Math.min(otk.capacity,otk.currentLevel+old.quantity);
        logFuelMovement(old.tankId,'fill',old.quantity,otk.currentLevel,restored,'edit_restore',id);
        DB.update('tanks',old.tankId,{currentLevel:restored});}
    }
    DB.update('fuel',id,data);
    // Re-deduct from new tank
    if(tankId){const tk=DB.find('tanks',tankId);if(tk){const b=tk.currentLevel,a=Math.max(0,tk.currentLevel-qty);DB.update('tanks',tankId,{currentLevel:a});logFuelMovement(tankId,'consume',qty,b,a,'vehicle_fuel_edit',id);}}
    logAct('تعديل تعبئة',`${v?.name||''} ${qty}L`);
    toast('تم التحديث');
  } else {
    const newRec=DB.add('fuel',data);
    // Deduct from tank + log movement
    if(tankId){const tk=DB.find('tanks',tankId);if(tk){const b=tk.currentLevel,a=Math.max(0,tk.currentLevel-qty);DB.update('tanks',tankId,{currentLevel:a});logFuelMovement(tankId,'consume',qty,b,a,'vehicle_fuel',newRec.id);}}
    logAct('إضافة تعبئة',`${v?.name||''} ${qty}L`);
    toast('تمت إضافة التعبئة');
  }
  _fuelVPreset='';closeModal();renderFuel();
}

          <input class="f-input" type="date" id="fdf" onchange="filterFuel()">

      <div id="fuelSum" style="display:flex;gap:24px;padding:9px 18px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap">

        <span>📋 العمليات: <strong>${fuelData.length}</strong></span>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>التاريخ</th><th>السيارة</th><th>المشروع</th><th>المصدر</th><th>الكمية</th><th>سعر/لتر</th><th>التكلفة</th><th>العداد</th><th>المسافة</th><th>الإجراءات</th></tr></thead>

  if(_sf.vf)document.getElementById('fvf').value=_sf.vf;

  if(_sf.df)document.getElementById('fdf').value=_sf.df;
  if(_sf.tf)document.getElementById('ftf').value=_sf.tf;
  if(Object.values(_sf).some(Boolean))filterFuel();
}
function renderFuelRows(rows){
  if(!rows.length)return`<tr><td colspan="11" class="tbl-empty"><div class="ei">⛽</div><p>لا توجد سجلات</p></td></tr>`;
  return rows.map((r,i)=>{
    const v=DB.find('vehicles',r.vehicleId),p=DB.find('projects',r.projectId),tk=r.tankId?DB.find('tanks',r.tankId):null;
    const odoCell=r.odometer?`<span style="font-size:12px;font-weight:600">${fmtNum(r.odometer)}<br><span class="text-muted">كم</span></span>`:'<span class="text-muted">-</span>';
    const distCell=r.distance!=null?(r.distance>=0?`<span class="text-success" style="font-weight:700;font-size:12px">+${fmtNum(r.distance)} كم</span>`:`<span class="text-danger" style="font-size:12px">${fmtNum(r.distance)} كم</span>`):'<span class="text-muted">-</span>';
    const aprvMap={approved:'<span class="badge b-success" style="font-size:11px">✅ معتمدة</span>',rejected:'<span class="badge b-danger" style="font-size:11px">❌ مرفوضة</span>',pending:'<span class="badge b-warning" style="font-size:11px">⏳ انتظار</span>'};

    return`<tr style="${r.approvalStatus==='rejected'?'opacity:0.6':''}"><td>${i+1}</td><td style="white-space:nowrap">${fmtDate(r.date||r.createdAt)}${r.fillTime?`<br><span style="font-size:11px;color:var(--text-light)">🕐 ${r.fillTime}</span>`:''}${aprvBadge?'<br>'+aprvBadge:''}</td>
      <td>${v?esc(v.name):'<em class="text-muted">-</em>'}</td>
      <td>${p?esc(p.name):'-'}</td>
      <td>${tk?`<span class="badge b-info">${esc(tk.name)}</span>`:'<span class="text-muted">خارجي</span>'}</td>
      <td><strong>${fmtNum(r.quantity)}</strong> لتر</td>
      <td><span class="text-muted" style="font-size:12px">${r.pricePerLiter?r.pricePerLiter+' ر.س':'-'}</span></td>

        ${can('fuel_delete')?`<button class="btn btn-sm btn-danger" onclick="confirmDelFuel('${r.id}')">🗑️</button>`:''}
      </td></tr>`;}).join('');

function filterFuel(){
  const vf=document.getElementById('fvf').value,pf=document.getElementById('fpf')?.value||'';
  const df=document.getElementById('fdf').value,tf=document.getElementById('ftf').value;
  let rows=DB.all('fuel').sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));
  const driverVehIds=getDriverVehicleIds();
  if(driverVehIds) rows=rows.filter(r=>driverVehIds.includes(r.vehicleId));
  if(vf)rows=rows.filter(r=>r.vehicleId===vf);if(pf)rows=rows.filter(r=>r.projectId===pf);
  if(df)rows=rows.filter(r=>(r.date||r.createdAt.slice(0,10))>=df);
  if(tf)rows=rows.filter(r=>(r.date||r.createdAt.slice(0,10))<=tf);
  _currentFuelRows=rows;
  document.getElementById('fuelTb').innerHTML=renderFuelRows(rows);
  document.querySelector('.card-title').textContent=`سجل المحروقات (${rows.length})`;
  const tQ=rows.reduce((s,r)=>s+(parseFloat(r.quantity)||0),0),tC=rows.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
  document.getElementById('fuelSum').innerHTML=`<span>⛽ الكمية: <strong>${fmtNum(tQ)} لتر</strong></span><span>💰 التكلفة: <strong>${fmtNum(tC)} ر.س</strong></span><span>📋 العمليات: <strong>${rows.length}</strong></span>`;
}
function confirmDelFuel(id){
  confirm2('حذف هذا السجل؟',()=>{
    const r=DB.find('fuel',id);
    if(r?.tankId){
      const tk=DB.find('tanks',r.tankId);
      if(tk){
        const restored=Math.min(tk.capacity,tk.currentLevel+r.quantity);
        logFuelMovement(r.tankId,'fill',r.quantity,tk.currentLevel,restored,'delete_restore',id);
        DB.update('tanks',r.tankId,{currentLevel:restored});
      }
    }
    DB.del('fuel',id);logAct('حذف تعبئة',DB.find('vehicles',r?.vehicleId)?.name||'');toast('تم الحذف');renderFuel();
  });
}

function renderDriverFuelApproval(){

  openModal(`اعتماد تعبئاتي — ${pending.length} بانتظار`,`
    <div style="max-height:420px;overflow-y:auto">
      ${pending.map(r=>{
        const v=DB.find('vehicles',r.vehicleId),p=DB.find('projects',r.projectId);
        return`<div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <div>
              <strong>${v?esc(v.name):'مركبة'}</strong>
              <span class="text-muted" style="font-size:12px"> — ${fmtDate(r.date||r.createdAt)}${r.fillTime?` — 🕐 ${r.fillTime}`:''}</span><br>
              <span style="font-size:13px">${fmtNum(r.quantity)} لتر — <strong>${fmtNum(r.cost)} ر.س</strong>${p?' — '+esc(p.name):''}</span>
              ${r.odometer?`<br><span class="text-muted" style="font-size:12px">عداد: ${fmtNum(r.odometer)} كم</span>`:''}
              <br><span class="text-muted" style="font-size:11px">بواسطة: ${esc(r.userName||'-')}</span>
            </div>
            <div class="tbl-actions">
              <button class="btn btn-sm btn-success" onclick="driverApproveFuel('${r.id}')">✅ اعتماد</button>
              <button class="btn btn-sm btn-danger" onclick="driverRejectFuel('${r.id}')">❌ رفض</button>
            </div>
          </div>
        </div>`;}).join('')}
    </div>`,null,null);
}
function driverApproveFuel(id){
  const driver=getLinkedDriver();
  const r=DB.find('fuel',id);
  if(!driver||!driver.vehicleIds?.includes(r?.vehicleId)){toast('ليس لديك صلاحية على هذه المركبة','error');return;}
  DB.update('fuel',id,{approvalStatus:'approved',approvedBy:currentUser.id,approvedByName:currentUser.name,approvedAt:new Date().toISOString()});
  const v=DB.find('vehicles',r?.vehicleId);
  logAct('اعتماد تعبئة (سائق)',v?.name||'');
  toast(`✅ تم اعتماد تعبئة: ${esc(v?.name||'')}`,`success`);
  closeModal();
  const remaining=DB.all('fuel').filter(f=>(f.approvalStatus==='pending'||!f.approvalStatus)&&driver.vehicleIds.includes(f.vehicleId));
  if(remaining.length)renderDriverFuelApproval();else{toast('تم اعتماد جميع تعبئاتك','info');renderFuel();}
}
function driverRejectFuel(id){
  const driver=getLinkedDriver();
  const r=DB.find('fuel',id);
  if(!driver||!driver.vehicleIds?.includes(r?.vehicleId)){toast('ليس لديك صلاحية على هذه المركبة','error');return;}
  const reason=prompt('سبب الرفض (اختياري):');
  if(r?.tankId){
    const tk=DB.find('tanks',r.tankId);
    if(tk){const restored=Math.min(tk.capacity,tk.currentLevel+(parseFloat(r.quantity)||0));
      DB.update('tanks',r.tankId,{currentLevel:restored});
      logFuelMovement(r.tankId,'fill',r.quantity,tk.currentLevel,restored,'driver_reject_restore',id);}
  }
  DB.update('fuel',id,{approvalStatus:'rejected',rejectedBy:currentUser.id,rejectedByName:currentUser.name,rejectedAt:new Date().toISOString(),rejectionReason:reason||''});
  const v=DB.find('vehicles',r?.vehicleId);
  logAct('رفض تعبئة (سائق)',v?.name||'');
  toast(`❌ تم رفض التعبئة`,`warning`);
  closeModal();
  const remaining=DB.all('fuel').filter(f=>(f.approvalStatus==='pending'||!f.approvalStatus)&&driver.vehicleIds.includes(f.vehicleId));
  if(remaining.length)renderDriverFuelApproval();else{toast('انتهت قائمة الانتظار','info');renderFuel();}
}

const MAINT_TYPES=['تغيير زيت','تغيير إطارات','تغيير فلاتر','صيانة دورية','إصلاح','فحص دوري','تغيير بطارية','أخرى'];

let _currentMaintRows=[];
function renderMaintenance(){
  if(!can('maintenance_view')){toast('ليس لديك صلاحية','error');navigate('dashboard');return;}
  document.getElementById('topActions').innerHTML=
    (can('maintenance_add')?`<button class="btn btn-primary" onclick="openMaintModal()">+ إضافة صيانة</button> `:'') +
    (can('maintenance_view')||can('reports_export_excel')?`<button class="btn btn-secondary" onclick="exportMaintExcel()">📥 تصدير Excel</button> `:'') +
    (can('maintenance_add')?`<button class="btn btn-secondary" onclick="importMaintExcel()">📤 استيراد Excel</button> <button class="btn btn-sm btn-secondary" onclick="downloadImportTemplate('maintenance')" title="تحميل قالب الاستيراد">📋</button>`:'');
  const vehicles=DB.all('vehicles').filter(v=>!v.archived),projects=DB.all('projects');
  const rows=DB.all('maintenance').sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));

  document.getElementById('pageBody').innerHTML=`
    <div class="card">
      <div class="card-header"><span class="card-title">سجل الصيانة (${rows.length})</span>
        <div class="filter-bar">
          <select class="f-select" id="mvf" onchange="filterMaint()"><option value="">كل السيارات</option>${vehicles.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select>
          <select class="f-select" id="mpf" onchange="filterMaint()"><option value="">كل المشاريع</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
          <input class="f-input" type="date" id="mdf" onchange="filterMaint()">
          <input class="f-input" type="date" id="mtf" onchange="filterMaint()">
        </div></div>
      <div style="padding:9px 18px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:13px">
        💰 إجمالي التكاليف: <strong>${fmtNum(tC)} ر.س</strong> — 📋 السجلات: <strong>${rows.length}</strong>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>السيارة</th><th>النوع</th><th>المشروع</th><th>التكلفة</th><th>تاريخ الصيانة</th><th>الصيانة القادمة</th><th>الورشة</th><th>الإجراءات</th></tr></thead>
        <tbody id="maintTb">${renderMaintRows(rows)}</tbody>
      </table></div>
    </div>`;
}
function renderMaintRows(rows){
  if(!rows.length)return`<tr><td colspan="9" class="tbl-empty"><div class="ei">🔧</div><p>لا توجد سجلات</p></td></tr>`;
  return rows.map((m,i)=>{
    const v=DB.find('vehicles',m.vehicleId),p=DB.find('projects',m.projectId);
    const nd=m.nextDate?daysUntil(m.nextDate):null;
    const nb=m.nextDate?(nd<=0?'<span class="badge b-danger">منتهي</span>':nd<=30?`<span class="badge b-warning">${nd} يوم</span>`:`<span class="badge b-success">${fmtDate(m.nextDate)}</span>`):'<span class="text-muted">-</span>';
    return`<tr><td>${i+1}</td><td>${v?esc(v.name):'-'}</td>
      <td><span class="badge b-secondary">${esc(m.type||'-')}</span></td>
      <td>${p?esc(p.name):'-'}</td>
      <td><strong>${fmtNum(m.cost)}</strong> ر.س</td>
      <td>${fmtDate(m.date||m.createdAt)}</td><td>${nb}</td><td>${esc(m.workshop||'-')}</td>
      <td class="tbl-actions">
        ${can('maintenance_edit')?`<button class="btn btn-sm btn-info" onclick="openMaintModal('${m.id}')">✏️</button>`:''}
        ${can('maintenance_delete')?`<button class="btn btn-sm btn-danger" onclick="confirmDelMaint('${m.id}')">🗑️</button>`:''}
      </td></tr>`;}).join('');
}
function filterMaint(){
  const vf=document.getElementById('mvf').value,pf=document.getElementById('mpf').value;
  const df=document.getElementById('mdf').value,tf=document.getElementById('mtf').value;
  let rows=DB.all('maintenance').sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));
  if(vf)rows=rows.filter(r=>r.vehicleId===vf);if(pf)rows=rows.filter(r=>r.projectId===pf);
  if(df)rows=rows.filter(r=>(r.date||r.createdAt.slice(0,10))>=df);
  if(tf)rows=rows.filter(r=>(r.date||r.createdAt.slice(0,10))<=tf);
  _currentMaintRows=rows;
  document.getElementById('maintTb').innerHTML=renderMaintRows(rows);
}
function openMaintModal(id){
  const m=id?DB.find('maintenance',id):null;
  const vehicles=DB.all('vehicles').filter(v=>!v.archived),projects=DB.all('projects');
  const workshops=[...new Set(DB.all('maintenance').map(mx=>mx.workshop).filter(Boolean))];
  const curW=m?m.workshop||'':'';
  const isOtherW=curW&&!workshops.includes(curW);
  openModal(id?'تعديل سجل الصيانة':'إضافة صيانة جديدة',`
    <div class="form-row">
      <div class="form-group"><label>السيارة <span class="req">*</span></label>
        <select class="form-control" id="mm_v" onchange="updateMaintCostHint()">
          <option value="">-- اختر --</option>
          ${vehicles.map(v=>`<option value="${v.id}"${m&&m.vehicleId===v.id?' selected':''}>${esc(v.name)}${v.plate?' ('+v.plate+')':''}</option>`).join('')}
        </select></div>
      <div class="form-group"><label>نوع الصيانة</label>
        <select class="form-control" id="mm_t" onchange="updateMaintCostHint()">${MAINT_TYPES.map(t=>`<option${m&&m.type===t?' selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>تاريخ الصيانة</label><input class="form-control" type="date" id="mm_d" value="${m?m.date||today():today()}"></div>
      <div class="form-group"><label>تاريخ الصيانة القادمة</label><input class="form-control" type="date" id="mm_nd" value="${m?m.nextDate||'':''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>التكلفة (ر.س)</label>
        <input class="form-control" type="number" id="mm_c" value="${m?m.cost:''}" min="0" step="0.01">
        <div class="form-hint" id="mm_cost_hint"></div></div>
      <div class="form-group"><label>الورشة</label>
        <select class="form-control" id="mm_ws" onchange="onMaintWorkshopCh()">
          <option value="">-- اختر ورشة --</option>
          ${workshops.map(w=>`<option value="${esc(w)}"${curW===w&&!isOtherW?' selected':''}>${esc(w)}</option>`).join('')}
          <option value="__other__"${isOtherW?' selected':''}>أخرى - اكتب</option>
        </select>
        <input class="form-control" id="mm_w" placeholder="اكتب اسم الورشة" style="margin-top:6px;display:${isOtherW||!workshops.length?'block':'none'}" value="${isOtherW?esc(curW):''}">
      </div>
    </div>
    <div class="form-group"><label>المشروع</label>
      <select class="form-control" id="mm_p"><option value="">--</option>${projects.map(p=>`<option value="${p.id}"${m&&m.projectId===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="form-group"><label>الوصف</label><textarea class="form-control" id="mm_desc">${m?esc(m.description||''):''}</textarea></div>
    <div class="form-group"><label>ملاحظات</label><textarea class="form-control" id="mm_n">${m?esc(m.notes||''):''}</textarea></div>`,
    'حفظ',()=>saveMaint(id),{wide:true});
  setTimeout(()=>updateMaintCostHint(),80);
}
function onMaintWorkshopCh(){
  const ws=document.getElementById('mm_ws'),wi=document.getElementById('mm_w');
  if(!ws||!wi)return;
  wi.style.display=ws.value==='__other__'||!ws.value?'block':'none';
  if(ws.value!=='__other__')wi.value='';
}
function updateMaintCostHint(){
  const vId=document.getElementById('mm_v')?.value;
  const mType=document.getElementById('mm_t')?.value;
  const hint=document.getElementById('mm_cost_hint');
  if(!hint)return;
  if(!vId||!mType){hint.textContent='';return;}
  const recs=DB.all('maintenance').filter(r=>r.vehicleId===vId&&r.type===mType&&r.cost>0);
  if(!recs.length){hint.textContent='';return;}
  const avg=recs.reduce((s,r)=>s+(parseFloat(r.cost)||0),0)/recs.length;
  hint.innerHTML=`متوسط تكلفة ${esc(mType)} لهذه السيارة: <strong>${fmtNum(avg.toFixed(0))} ر.س</strong> (${recs.length} عملية)`;
}
function saveMaint(id){
  if(id?!can('maintenance_edit'):!can('maintenance_add')){toast('ليس لديك صلاحية','error');return;}
  const vehicleId=document.getElementById('mm_v').value;
  if(!vehicleId){toast('اختر السيارة','error');return;}
  const data={vehicleId,type:document.getElementById('mm_t').value,date:document.getElementById('mm_d').value,
    nextDate:document.getElementById('mm_nd').value||null,cost:parseFloat(document.getElementById('mm_c').value)||0,
    workshop:(()=>{const ws=document.getElementById('mm_ws'),wi=document.getElementById('mm_w');return ws&&(ws.value==='__other__'||!ws.value)?wi.value.trim():ws?.value||wi?.value||'';})(),projectId:document.getElementById('mm_p').value||null,
    description:document.getElementById('mm_desc').value.trim(),notes:document.getElementById('mm_n').value.trim(),
    userId:currentUser.id,userName:currentUser.name};
  if(!data.date){toast('أدخل تاريخ الصيانة','error');return;}
  const vn=DB.find('vehicles',vehicleId)?.name||'';
  if(id){DB.update('maintenance',id,data);logAct('تعديل صيانة',vn);}else{DB.add('maintenance',data);logAct('إضافة صيانة',vn);}
  toast(id?'تم التحديث':'تمت الإضافة');closeModal();renderMaintenance();
}
function confirmDelMaint(id){
  const m=DB.find('maintenance',id);
  confirm2('حذف هذا السجل؟',()=>{DB.del('maintenance',id);logAct('حذف صيانة',DB.find('vehicles',m?.vehicleId)?.name||'');toast('تم الحذف');renderMaintenance();});
}

/* ============================================================
   EXCEL EXPORT — FUEL
   ============================================================ */
function exportFuelExcel(){
  if(!can('fuel_view')&&!can('reports_export_excel')){toast('ليس لديك صلاحية','error');return;}
  const rows=_currentFuelRows;
  if(!rows.length){toast('لا توجد بيانات للتصدير','error');return;}
  const hdrs=['التاريخ','الوقت','السيارة','المصدر','الكمية (لتر)','التكلفة (ر.س)','العداد (كم)','المشروع','الحالة'];
  const data=rows.map(r=>{
    const v=DB.find('vehicles',r.vehicleId),p=DB.find('projects',r.projectId),tk=r.tankId?DB.find('tanks',r.tankId):null;
    const statusMap={approved:'معتمدة',rejected:'مرفوضة',pending:'انتظار'};
    return[r.date||r.createdAt.slice(0,10),r.fillTime||'',v?v.name:'',tk?tk.name:'خارجي',parseFloat(r.quantity)||0,parseFloat(r.cost)||0,r.odometer||'',p?p.name:'',statusMap[r.approvalStatus]||'معتمدة'];
  });
  const ws=XLSX.utils.aoa_to_sheet([hdrs,...data]);
  ws['!cols']=[{wch:12},{wch:8},{wch:20},{wch:15},{wch:12},{wch:14},{wch:12},{wch:18},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الوقود');
  XLSX.writeFile(wb,`fuel_export_${today()}.xlsx`);
  logAct('تصدير Excel وقود',`${rows.length} سجل`);toast(`تم تصدير ${rows.length} سجل`);
}

/* ============================================================
   EXCEL IMPORT — FUEL
   ============================================================ */
function importFuelExcel(){
  if(!can('fuel_add')){toast('ليس لديك صلاحية','error');return;}
  const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';
  inp.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(raw.length<2){toast('الملف فارغ أو لا يحتوي على بيانات','error');return;}
      const hdrRow=(raw[0]||[]).map(h=>String(h).trim());
      // Map columns by header name
      const col=name=>hdrRow.findIndex(h=>h.includes(name));
      const iDate=col('التاريخ'),iVeh=col('السيارة'),iQty=col('الكمية'),iCost=col('التكلفة'),iTime=col('الوقت'),iOdo=col('العداد'),iPrj=col('المشروع');
      if(iDate<0||iVeh<0||iQty<0){toast('الملف يجب أن يحتوي على أعمدة: التاريخ، السيارة، الكمية','error');return;}
      const vehicles=DB.all('vehicles');const projects=DB.all('projects');
      const existing=DB.all('fuel');
      let imported=0,skipped=0,errors=[];
      const toImport=[];
      for(let i=1;i<raw.length;i++){
        const row=raw[i];
        const dateVal=String(row[iDate]||'').trim();
        const vehName=String(row[iVeh]||'').trim();
        const qty=parseFloat(String(row[iQty]||'').replace(/[^\d.]/g,''))||0;
        if(!dateVal||!vehName||qty<=0){skipped++;continue;}
        const veh=vehicles.find(v=>v.name===vehName||v.plate===vehName);
        if(!veh){errors.push(`سطر ${i+1}: سيارة غير موجودة "${vehName}"`);skipped++;continue;}
        const cost=iCost>=0?parseFloat(String(row[iCost]||'').replace(/[^\d.]/g,''))||0:0;
        const fillTime=iTime>=0?String(row[iTime]||'').trim():'';
        const odometer=iOdo>=0?parseInt(String(row[iOdo]||'').replace(/[^\d]/g,''))||null:null;
        const prjName=iPrj>=0?String(row[iPrj]||'').trim():'';
        const prj=prjName?projects.find(p=>p.name===prjName):null;
        // Duplicate check: same date + vehicle + quantity
        const dup=existing.find(r=>(r.date||r.createdAt.slice(0,10))===dateVal&&r.vehicleId===veh.id&&parseFloat(r.quantity)===qty);
        if(dup){skipped++;continue;}
        toImport.push({vehicleId:veh.id,date:dateVal,quantity:qty,cost,fillTime:fillTime||null,odometer,projectId:prj?prj.id:null,approvalStatus:'pending',userId:currentUser.id,userName:currentUser.name});
      }
      if(!toImport.length&&!errors.length){toast('لا توجد سجلات جديدة للاستيراد (كل السجلات موجودة أو ناقصة)','info');return;}
      const msg=`تم قراءة الملف:\n• سيُستورَد: ${toImport.length} سجل\n• مكرر/ناقص: ${skipped}\n${errors.length?'• أخطاء:\n'+errors.slice(0,5).join('\n')+(errors.length>5?`\n...و${errors.length-5} أخرى`:''):''}\n\nهل تريد الاستيراد؟`;
      confirm2(msg,()=>{
        toImport.forEach(r=>DB.add('fuel',r));
        logAct('استيراد Excel وقود',`${toImport.length} سجل`);
        toast(`✅ تم استيراد ${toImport.length} من أصل ${toImport.length+skipped} سجل`);
        renderFuel();
      });
    }catch(err){toast('خطأ في قراءة الملف: '+err.message,'error');}
  };
  inp.click();
}

function renderInvRows(list){
  if(!list.length)return`<tr><td colspan="9" class="tbl-empty"><div class="ei">🧾</div><p>لا توجد فواتير</p></td></tr>`;
  return list.map((r,i)=>{
    const v=DB.find('vehicles',r.vehicleId),p=DB.find('projects',r.projectId);
    const attCount=DB.all('attachments').filter(a=>a.entityType==='invoice'&&a.entityId===r.id).length;
    return`<tr><td>${i+1}</td>
      <td><span class="code-tag">${esc(r.invoiceNo||'-')}</span></td>
      <td>${fmtDate(r.date||r.createdAt)}</td>
      <td>${v?esc(v.name):'-'}</td><td>${p?esc(p.name):'-'}</td>
      <td><strong>${fmtNum(r.amount)}</strong> ر.س</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.description||'-')}</td>
      <td>${attCount>0?`<span class="badge b-info">📎 ${attCount}</span>`:'<span class="text-muted">-</span>'}</td>
      <td class="tbl-actions">
        <button class="btn btn-sm btn-secondary" onclick="viewInvoiceAtts('${r.id}')">📎</button>
        ${can('invoices_delete')?`<button class="btn btn-sm btn-danger" onclick="confirmDelInvoice('${r.id}')">🗑️</button>`:''}
      </td></tr>`;}).join('');
}
function filterInvoices(){
  const vf=document.getElementById('ivf').value,pf=document.getElementById('ipf').value,df=document.getElementById('idf').value;
  let rows=DB.all('invoices').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(vf)rows=rows.filter(r=>r.vehicleId===vf);if(pf)rows=rows.filter(r=>r.projectId===pf);
  if(df)rows=rows.filter(r=>(r.date||r.createdAt.slice(0,10))>=df);
  document.getElementById('invTb').innerHTML=renderInvRows(rows);
}
function openInvoiceModal(id){
  const r=id?DB.find('invoices',id):null;
  const vehicles=DB.all('vehicles').filter(v=>!v.archived),projects=DB.all('projects');
  openModal(id?'تعديل الفاتورة':'رفع فاتورة جديدة',`
    <div class="form-row">
      <div class="form-group"><label>رقم الفاتورة</label><input class="form-control" id="ivm_n" value="${r?esc(r.invoiceNo||''):''}"></div>
      <div class="form-group"><label>التاريخ</label><input class="form-control" type="date" id="ivm_d" value="${r?r.date||today():today()}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>المبلغ (ر.س)</label><input class="form-control" type="number" id="ivm_a" value="${r?r.amount:''}" min="0" step="0.01"></div>
      <div class="form-group"><label>السيارة</label>
        <select class="form-control" id="ivm_v"><option value="">--</option>${vehicles.map(v=>`<option value="${v.id}"${r&&r.vehicleId===v.id?' selected':''}>${esc(v.name)}</option>`).join('')}</select></div>
    </div>
    <div class="form-group"><label>المشروع</label>
      <select class="form-control" id="ivm_p"><option value="">--</option>${projects.map(p=>`<option value="${p.id}"${r&&r.projectId===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="form-group"><label>الوصف</label><textarea class="form-control" id="ivm_desc">${r?esc(r.description||''):''}</textarea></div>
    <div class="form-group"><label>ملاحظات</label><textarea class="form-control" id="ivm_notes">${r?esc(r.notes||''):''}</textarea></div>`,

function saveInvoice(id){
  if(id?!can('invoices_edit'):!can('invoices_add')){toast('ليس لديك صلاحية','error');return;}
  const data={invoiceNo:document.getElementById('ivm_n').value.trim(),date:document.getElementById('ivm_d').value,
    amount:parseFloat(document.getElementById('ivm_a').value)||0,vehicleId:document.getElementById('ivm_v').value||null,
    projectId:document.getElementById('ivm_p').value||null,description:document.getElementById('ivm_desc').value.trim(),
    notes:document.getElementById('ivm_notes').value.trim(),userId:currentUser.id,userName:currentUser.name};
  let savedId=id;
  if(id){DB.update('invoices',id,data);logAct('تعديل فاتورة',data.invoiceNo||'');}
  else{const rec=DB.add('invoices',data);savedId=rec.id;logAct('رفع فاتورة',data.invoiceNo||'');}
  toast(id?'تم التحديث':'تمت الإضافة');closeModal();
  // Offer attachment upload
  if(!id){
    setTimeout(()=>{
      if(confirm('هل تريد إرفاق ملف للفاتورة؟')){
        uploadAttachment('invoice',savedId,()=>renderInvoices());

}
function viewInvoiceAtts(id){
  const r=DB.find('invoices',id);

    renderAttachments('invoice',id,can('invoices_add'),can('invoices_delete')),

function confirmDelInvoice(id){
  confirm2('حذف هذه الفاتورة؟',()=>{
    DB.del('invoices',id);

  });
}

let _lastReportType='';

function showReport(type){
  const area=document.getElementById('reportArea');
  if(!area && !_captureReport)return;
  _lastReportType=type;

  // Read filter values
  const df=document.getElementById('rpt_df')?.value||'';
  const tf=document.getElementById('rpt_tf')?.value||'';
  const vf=document.getElementById('rpt_vf')?.value||'';
  const pf=document.getElementById('rpt_pf')?.value||'';
  const gf=document.getElementById('rpt_gf')?.value||'';

  // Group vehicles for group filter
  const gVeh=gf?DB.all('vehicles').filter(v=>v.groupId===gf).map(v=>v.id):null;

  // Base datasets with approval filter
  let fuel=DB.all('fuel').filter(r=>r.approvalStatus==='approved'||!r.approvalStatus);
  let maint=DB.all('maintenance');
  const vehicles=DB.all('vehicles'),projects=DB.all('projects'),users=DB.all('users');

  // Apply common filters to fuel
  if(df) fuel=fuel.filter(r=>(r.date||r.createdAt.slice(0,10))>=df);
  if(tf) fuel=fuel.filter(r=>(r.date||r.createdAt.slice(0,10))<=tf);
  if(vf) fuel=fuel.filter(r=>r.vehicleId===vf);
  if(pf) fuel=fuel.filter(r=>r.projectId===pf);
  if(gVeh) fuel=fuel.filter(r=>gVeh.includes(r.vehicleId));

  // Apply common filters to maint
  if(df) maint=maint.filter(r=>(r.date||r.createdAt.slice(0,10))>=df);
  if(tf) maint=maint.filter(r=>(r.date||r.createdAt.slice(0,10))<=tf);
  if(vf) maint=maint.filter(r=>r.vehicleId===vf);
  if(pf) maint=maint.filter(r=>r.projectId===pf);
  if(gVeh) maint=maint.filter(r=>gVeh.includes(r.vehicleId));

  if(type==='fuelVeh'){
    const byVeh={};
    fuel.forEach(r=>{
      const k=r.vehicleId||'_none_';
      if(!byVeh[k])byVeh[k]={liters:0,cost:0,count:0};
      byVeh[k].liters+=(parseFloat(r.quantity)||0);
      byVeh[k].cost+=(parseFloat(r.cost)||0);
      byVeh[k].count++;
    });
    const rows=Object.entries(byVeh).sort((a,b)=>b[1].cost-a[1].cost).map(([vid,d])=>{
      const v=DB.find('vehicles',vid);const g=v?DB.find('groups',v.groupId):null;const p=v?DB.find('projects',v.projectId):null;
      return[v?v.name:'غير محدد',g?g.name:'-',p?p.name:'-',v?v.fuelType:'-',fmtNum(d.liters)+' لتر',fmtNum(d.cost)+' ر.س',d.count];
    });
    const tL=fuel.reduce((s,r)=>s+(parseFloat(r.quantity)||0),0),tC=fuel.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
    const hdrs=['السيارة','المجموعة','المشروع','الوقود','الكمية','التكلفة','العمليات'];
    {const _rh=buildReportCard('⛽ تقرير الوقود بالسيارة',hdrs,rows,
      [{label:'إجمالي الكمية',val:fmtNum(tL)+' لتر'},{label:'إجمالي التكلفة',val:fmtNum(tC)+' ر.س'}],
      type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='fuelPrj'){
    const byPrj={};
    fuel.forEach(r=>{const k=r.projectId||'_none_';if(!byPrj[k])byPrj[k]={liters:0,cost:0,vids:new Set()};byPrj[k].liters+=(parseFloat(r.quantity)||0);byPrj[k].cost+=(parseFloat(r.cost)||0);byPrj[k].vids.add(r.vehicleId);});
    const rows=Object.entries(byPrj).sort((a,b)=>b[1].cost-a[1].cost).map(([pid,d])=>{
      const p=DB.find('projects',pid);
      return[p?p.name:'بدون مشروع',fmtNum(d.liters)+' لتر',fmtNum(d.cost)+' ر.س',d.vids.size];
    });
    const hdrs=['المشروع','الكمية','التكلفة','عدد السيارات'];
    {const _rh=buildReportCard('🏗️ تقرير الوقود بالمشروع',hdrs,rows,[],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='maintRep'){
    const rows=maint.slice().sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt)).map(m=>{
      const v=DB.find('vehicles',m.vehicleId),p=DB.find('projects',m.projectId);
      return[v?v.name:'-',m.type||'-',p?p.name:'-',fmtDate(m.date||m.createdAt),fmtNum(m.cost)+' ر.س',m.workshop||'-'];
    });
    const tC=maint.reduce((s,m)=>s+(parseFloat(m.cost)||0),0);
    const hdrs=['السيارة','النوع','المشروع','التاريخ','التكلفة','الورشة'];
    {const _rh=buildReportCard('🔧 تقرير الصيانة',hdrs,rows,[{label:'إجمالي التكاليف',val:fmtNum(tC)+' ر.س'}],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='monthly'){
    // For monthly: apply date & group filters; vehicle/project filters already applied above
    const months={};
    fuel.forEach(r=>{const m=(r.date||r.createdAt).slice(0,7);if(!months[m])months[m]={fuel:0,maint:0};months[m].fuel+=(parseFloat(r.cost)||0);});
    maint.forEach(r=>{const m=(r.date||r.createdAt).slice(0,7);if(!months[m])months[m]={fuel:0,maint:0};months[m].maint+=(parseFloat(r.cost)||0);});
    const rows=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,d])=>{
      const total=d.fuel+d.maint;
      const dt=new Date(m+'-01');const label=dt.toLocaleDateString('ar-SA',{year:'numeric',month:'long'});
      return[label,fmtNum(d.fuel)+' ر.س',fmtNum(d.maint)+' ر.س',fmtNum(total)+' ر.س'];
    });
    const tF=fuel.reduce((s,r)=>s+(parseFloat(r.cost)||0),0),tM=maint.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
    const hdrs=['الشهر','تكلفة الوقود','تكلفة الصيانة','الإجمالي'];
    {const _rh=buildReportCard('📅 تقرير المصروفات الشهرية',hdrs,rows,
      [{label:'وقود',val:fmtNum(tF)+' ر.س'},{label:'صيانة',val:fmtNum(tM)+' ر.س'},{label:'الإجمالي',val:fmtNum(tF+tM)+' ر.س'}],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='usersRep'){
    const rows=users.map((u,i)=>{
      const uFuel=fuel.filter(f=>f.userId===u.id).length;
      const uMaint=maint.filter(m=>m.userId===u.id).length;
      const roleMap={owner:'مالك',admin:'مدير',user:'مستخدم'};
      return[i+1,u.name,u.username,roleMap[u.role]||u.role,uFuel,uMaint];
    });
    const hdrs=['#','الاسم','المستخدم','الصلاحية','عمليات وقود','عمليات صيانة'];
    {const _rh=buildReportCard('👥 تقرير المستخدمين',hdrs,rows,[],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
}

let _lastReport={type:'',hdrs:[],rows:[]};
function doExportCSV(type){
  _captureReport=true;
  showReport(type);_captureReport=false;
  if(!_lastReport.rows.length){toast('لا توجد بيانات للتصدير','error');return;}
  const ws=XLSX.utils.aoa_to_sheet([_lastReport.hdrs,..._lastReport.rows]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'تقرير');
  XLSX.writeFile(wb,`report_${type}_${today()}.xlsx`);
  logAct('تصدير Excel',type);toast('تم تصدير الملف');
}
let _captureReport=false;

function doPrint(type){
  _captureReport=true;showReport(type);_captureReport=false;
  if(!_lastReport.hdrs.length)return;
  const w=window.open('','_blank');
  if(!w){toast('لم يمكن فتح نافذة الطباعة','error');return;}
  const tbl=`<table border="1" style="border-collapse:collapse;width:100%;font-size:13px">
    <thead style="background:#eee"><tr>${_lastReport.hdrs.map(h=>`<th style="padding:8px">${h}</th>`).join('')}</tr></thead>
    <tbody>${_lastReport.rows.map(r=>`<tr>${r.map(c=>`<td style="padding:7px">${c}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
  w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>تقرير</title>
    <style>body{font-family:Arial,sans-serif;direction:rtl;padding:20px}h2{text-align:center}@media print{.np{display:none}}</style>
  </head><body><h2>${PAGE_TITLES[currentPage]||'تقرير'}</h2>
    <p style="color:#888;font-size:12px">تاريخ الطباعة: ${new Date().toLocaleDateString('ar-SA')} — ${esc(currentUser?.name||'')}</p>
    ${tbl}<br><button class="np" onclick="window.print()">🖨️ طباعة</button></body></html>`);
  w.document.close();logAct('تصدير PDF',type);
}

function buildReportCard(title,hdrs,rows,summaries,type,exportHdrs,exportRows){
  if(_captureReport){_lastReport={type,hdrs:exportHdrs||hdrs,rows:exportRows||rows};return'';}
  const canExcelExp=can('reports_export_excel');const canPrintExp=can('reports_export_pdf');
  const sumHtml=summaries.length?`<div style="display:flex;gap:20px;padding:10px 16px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap">
    ${summaries.map(s=>`<span>${s.label}: <strong>${s.val}</strong></span>`).join('')}
  </div>`:'';
  return`<div class="card">
    <div class="card-header"><span class="card-title">${title}</span>
      <div class="d-flex gap-2">
        ${canExcelExp?`<button class="btn btn-sm btn-success" onclick="doExportCSV('${type}')">📥 Excel</button>`:''}
        ${canPrintExp?`<button class="btn btn-sm btn-info" onclick="doPrint('${type}')">🖨️ طباعة</button>`:''}
      </div></div>
    ${sumHtml}
    <div class="tbl-wrap"><table>
      <thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.length===0?`<tr><td colspan="${hdrs.length}" class="tbl-empty"><p>لا توجد بيانات</p></td></tr>`:
        rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
}

        <button type="button" class="btn btn-sm btn-secondary" onclick="toggleAllPerms(false)">إلغاء الكل</button>`:''}

async function saveUser(id){
  const name=document.getElementById('um_n').value.trim();
  const username=document.getElementById('um_u').value.trim();
  const password=document.getElementById('um_p').value;
  if(password&&password.length<6){toast('كلمة المرور 6 أحرف على الأقل','error');return;}
  const role=document.getElementById('um_r').value;
  if(!name){toast('أدخل الاسم','error');return;}
  if(!username){toast('أدخل اسم المستخدم','error');return;}
  if(!id&&!password){toast('أدخل كلمة المرور','error');return;}
  const dup=DB.all('users').find(u=>u.username.toLowerCase()===username.toLowerCase()&&u.id!==id);
  if(dup){toast('اسم المستخدم مستخدم بالفعل','error');return;}
  const u=id?DB.find('users',id):null;
  const isOwnerUser=u?.role==='owner';
  const data={name,username,role:isOwnerUser?'owner':role};
  if(password){
    try{data.password=await hashPwd(password);}
    catch{toast('خطأ في تشفير كلمة المرور — تأكد من استخدام HTTPS','error');return;}
  }
  if(!isOwnerUser)data.permissions=collectPerms();
  if(id){
    DB.update('users',id,data);
    logAct('تعديل مستخدم',name+(data.permissions?'+ تعديل صلاحيات':''));
    // Refresh session if editing self
    if(id===currentUser.id){currentUser={...currentUser,...data};sessionStorage.setItem('fm2_sess',JSON.stringify({id:currentUser.id}));}
    toast('تم التحديث');
  } else {
    DB.add('users',data);
    logAct('إضافة مستخدم',name);
    toast('تمت إضافة المستخدم');
  }
  closeModal();renderUsers();
}

function confirmDelUser(id){
  const u=DB.find('users',id);
  if(u?.role==='owner'){toast('لا يمكن حذف المالك الرئيسي','error');return;}
  if(id===currentUser.id){toast('لا يمكن حذف حسابك الحالي','error');return;}
  confirm2(`حذف المستخدم "${u?.name}"؟`,()=>{
    DB.del('users',id);
    DB.set('fuel',DB.all('fuel').map(r=>r.userId===id?{...r,userId:null,userName:'محذوف'}:r));
    DB.set('maintenance',DB.all('maintenance').map(r=>r.userId===id?{...r,userId:null,userName:'محذوف'}:r));
    logAct('حذف مستخدم',u?.name||'');toast('تم الحذف');renderUsers();
  });
}

function renderActRows(list){
  if(!list.length)return`<tr><td colspan="5" class="tbl-empty"><div class="ei">📋</div><p>لا توجد سجلات</p></td></tr>`;
  return list.map((l,i)=>`<tr>
    <td>${i+1}</td>
    <td><span class="badge b-info">${esc(l.userName||'-')}</span></td>
    <td><strong>${esc(l.action||'-')}</strong></td>
    <td class="text-muted" style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.details||'-')}</td>
    <td style="white-space:nowrap;font-size:12px">${fmtDateTime(l.createdAt)}</td>
  </tr>`).join('');
}
function filterActivity(){
  const uf=document.getElementById('alf').value;
  const sf=(document.getElementById('als').value||'').toLowerCase();
  const df=document.getElementById('ald').value;
  let rows=DB.all('activity').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(uf)rows=rows.filter(r=>r.userName===uf);
  if(sf)rows=rows.filter(r=>(r.action||'').toLowerCase().includes(sf)||(r.details||'').toLowerCase().includes(sf));
  if(df)rows=rows.filter(r=>r.createdAt.slice(0,10)===df);
  document.getElementById('actTb').innerHTML=renderActRows(rows);
}
function confirmClearActivity(){
  if(!isOwner()){toast('ليس لديك صلاحية','error');return;}
  confirm2('مسح جميع سجلات النشاط؟ لا يمكن التراجع.',()=>{
    DB.set('activity',[]);logAct('مسح سجل النشاط','');toast('تم مسح السجل');renderActivity();
  });
}

function renderBackup(){
  if(!isOwner()&&!can('backup_create')){toast('هذه الصفحة للمالك الرئيسي فقط','error');navigate('dashboard');return;}
  const tables=['users','groups','projects','vehicles','tanks','tankFills','fuel','maintenance','notes','invoices','attachments','activity','drivers','fuelMovements'];
  const counts=tables.map(t=>({t,c:DB.all(t).length}));

function createBackup(){
  const tables=['users','groups','projects','vehicles','tanks','tankFills','fuel','maintenance','notes','invoices','attachments','activity','drivers','fuelMovements'];
  const backup={version:2,date:new Date().toISOString(),createdBy:currentUser.name,data:{}};
  tables.forEach(t=>backup.data[t]=DB.all(t));
  backup.settings=DB.cfg.get('settings')||{};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`fuel_backup_${today()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),100);
  logAct('إنشاء نسخة احتياطية',today());toast('✅ تم تنزيل النسخة الاحتياطية بنجاح');
}

function restoreBackup(e){
  const file=e.target.files[0];if(!file)return;
  document.getElementById('bkInfo').textContent='جارٍ قراءة الملف...';
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const bk=JSON.parse(ev.target.result);
      if(!bk.data)throw new Error('ملف غير صحيح');
      const totalRecs=Object.values(bk.data).reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0);
      document.getElementById('bkInfo').innerHTML=`✅ الملف صحيح — ${totalRecs} سجل — بتاريخ ${fmtDate(bk.date)} — بواسطة: ${esc(bk.createdBy||'-')}`;
      confirm2(`استعادة نسخة بتاريخ ${fmtDate(bk.date)} (${totalRecs} سجل)؟ سيتم استبدال جميع البيانات الحالية.`,()=>{
        logAct('استعادة نسخة احتياطية',bk.date||'');
        const ALLOWED=['users','groups','projects','vehicles','tanks','tankFills',
          'fuel','maintenance','notes','invoices','attachments','activity','drivers','fuelMovements'];
        ALLOWED.forEach(t=>{if(Array.isArray(bk.data[t]))DB.set(t,bk.data[t]);});
        if(bk.settings)DB.cfg.set('settings',bk.settings);
        toast('✅ تمت الاستعادة — سيتم تسجيل الخروج...');
        document.getElementById('bkFile').value='';
        setTimeout(()=>logout(),2500);
      });
    }catch(err){
      document.getElementById('bkInfo').innerHTML=`<span style="color:var(--danger)">❌ ملف غير صحيح أو تالف</span>`;
      toast('ملف النسخة غير صحيح','error');
    }
  };
  reader.onerror=()=>toast('فشل قراءة ملف النسخة الاحتياطية','error');
  reader.readAsText(file);
}

/* ============================================================

   ============================================================ */
async function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  const errEl=document.getElementById('loginError');
  btn.disabled=true;btn.textContent='جارٍ التحقق...';
  try{
    const ok=await doLogin(
      document.getElementById('li_user').value.trim(),
      document.getElementById('li_pass').value
    );
    if(ok){errEl.style.display='none';showApp();}
    else{errEl.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';errEl.style.display='block';}
  }catch{
    errEl.textContent='حدث خطأ غير متوقع — تأكد من استخدام HTTPS';errEl.style.display='block';
  }finally{
    btn.disabled=false;btn.textContent='دخول';
  }
}

document.addEventListener('keydown',e=>{

  if(document.getElementById('confirmOverlay').style.display==='flex')closeConfirm();
  else if(document.getElementById('modalOverlay').style.display==='flex'&&!_modalSaving)closeModal();
});
(async()=>{
  // 1) Local-first: seed from cache so login works INSTANTLY, even if Firebase is slow/blocked
  try{await ensureLocalSeed();}catch(e){console.warn('seed:',e);}
  try{
    if(checkSession())showApp();
    else showLogin();
  }catch(err){
    console.error('bootstrap:',err);
    showLogin();
  }
  // 2) Background: sync with Firebase; refresh sidebar/data once it lands
  initApp().then(()=>{ try{ if(currentUser) buildSidebar(); }catch(e){} })
           .catch(e=>console.warn('bg sync:',e));
})();

function _emp_b64ToUtf8(b64){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
let _empMounted=false;
function showEmp(sub){
  const pb=document.getElementById('pageBody');
  const host=document.getElementById('empHost');
  if(pb) pb.style.display='none';
  host.style.display='flex';
  const fr=document.getElementById('empFrame');
  if(!_empMounted){
    _empMounted=true;
    fr.addEventListener('load',function(){ _emp_call(sub); });
    fr.srcdoc=_emp_b64ToUtf8(EMP_B64);
  } else {
    _emp_call(sub);
  }
}
function _emp_call(sub){
  const fr=document.getElementById('empFrame');
  let tries=0;
  (function attempt(){
    try{
      if(fr.contentWindow && typeof fr.contentWindow.showPage==='function'){
        fr.contentWindow.showPage(sub); return;
      }
    }catch(e){}
    if(tries++<20) setTimeout(attempt,150);
  })();
}
function hideEmp(){
  const host=document.getElementById('empHost');
  if(host) host.style.display='none';
  const pb=document.getElementById('pageBody');
  if(pb) pb.style.display='';
}
</script>
