<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة المحروقات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== VARIABLES ===================== */
:root {
  --primary:#1a2744; --primary-light:#243460; --primary-xlight:#2d4080;
  --accent:#e67e22; --accent-dark:#d35400;
  --success:#27ae60; --danger:#e74c3c; --warning:#f39c12; --info:#2980b9;
  --purple:#8e44ad;
  --bg:#f0f2f7; --card:#fff; --text:#2c3e50; --text-light:#7f8c8d;
  --border:#dde3ec; --border-light:#eef1f7;
  --sidebar-w:265px; --header-h:64px;
  --radius:10px; --radius-sm:6px;
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --shadow-md:0 4px 20px rgba(0,0,0,.13);
}
/* ===================== RESET ===================== */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:14px;line-height:1.5}
a{text-decoration:none}
button{font-family:'Cairo',sans-serif}
/* ===================== SCROLLBAR ===================== */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f0f2f7}
::-webkit-scrollbar-thumb{background:#c0c8d8;border-radius:4px}

/* ===================== LOGIN ===================== */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f1d3a 0%,#1a2744 45%,#243460 100%)}
#loginPage::before{content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.login-box{background:#fff;border-radius:18px;padding:48px 44px;width:100%;max-width:420px;
  box-shadow:0 25px 70px rgba(0,0,0,.4);text-align:center;position:relative;z-index:1}
.login-logo{font-size:56px;margin-bottom:6px;display:block}
.login-box h1{font-size:22px;font-weight:700;color:var(--primary);margin-bottom:4px}
.login-box .login-sub{color:var(--text-light);font-size:13px;margin-bottom:30px}
#loginError{background:#fde8e8;color:var(--danger);padding:10px 14px;border-radius:8px;
  margin-bottom:16px;font-size:13px;display:none;border-right:3px solid var(--danger)}

/* ===================== FORMS ===================== */
.form-group{margin-bottom:16px;text-align:right}
.form-group label{display:block;font-weight:600;margin-bottom:5px;color:var(--text);font-size:13px}
.form-group label .req{color:var(--danger)}
.form-control{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;
  font-family:'Cairo',sans-serif;font-size:14px;color:var(--text);background:#fafbfd;
  transition:border-color .2s,box-shadow .2s;direction:rtl}
.form-control:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,126,34,.12);background:#fff}
textarea.form-control{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-hint{font-size:12px;color:var(--text-light);margin-top:4px}
.form-divider{border:none;border-top:1px solid var(--border);margin:18px 0}
.form-section-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:12px;
  padding-bottom:6px;border-bottom:2px solid var(--accent);display:inline-block}

/* ===================== BUTTONS ===================== */
.btn{padding:9px 18px;border:none;border-radius:8px;font-family:'Cairo',sans-serif;font-size:13.5px;
  font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);box-shadow:0 4px 12px rgba(230,126,34,.3)}
.btn-secondary{background:#f0f2f7;color:var(--text)}
.btn-secondary:hover{background:#e2e6ef}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#219a52}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#c0392b}
.btn-info{background:var(--info);color:#fff}
.btn-info:hover{background:#1a6fa3}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#d68910}
.btn-purple{background:var(--purple);color:#fff}
.btn-purple:hover{background:#7d3c98}
.btn-dark{background:var(--primary);color:#fff}
.btn-dark:hover{background:var(--primary-light)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn-full{width:100%;justify-content:center;padding:11px}
.btn-icon{padding:6px 10px}

/* ===================== SIDEBAR ===================== */
#app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;right:0;width:var(--sidebar-w);height:100vh;
  background:var(--primary);display:flex;flex-direction:column;z-index:200;
  transition:transform .3s;overflow:hidden}
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:11px;flex-shrink:0}
.brand-icon{width:42px;height:42px;background:var(--accent);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand-text h2{color:#fff;font-size:14px;font-weight:700;line-height:1.2}
.brand-text small{color:rgba(255,255,255,.45);font-size:11px}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-section{margin-bottom:4px}
.nav-section-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.3);
  letter-spacing:1px;padding:6px 10px 2px;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:7px;
  color:rgba(255,255,255,.65);text-decoration:none;font-weight:500;font-size:13.5px;
  margin-bottom:2px;transition:all .18s;cursor:pointer;border:none;background:none;
  width:100%;text-align:right}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-btn.active{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(230,126,34,.35)}
.nav-btn .ni{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.nav-badge{margin-right:auto;background:var(--danger);color:#fff;border-radius:20px;
  font-size:11px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.user-card{background:rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.user-card .un{color:#fff;font-weight:700;font-size:13.5px}
.user-card .ur{margin-top:2px;display:flex;align-items:center;gap:6px}
.role-chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.role-owner{background:rgba(230,126,34,.25);color:#f39c12}
.role-admin{background:rgba(41,128,185,.25);color:#74b9ff}
.role-user{background:rgba(39,174,96,.2);color:#55efc4}
.btn-logout{width:100%;background:rgba(231,76,60,.15);color:#ff7675;border:none;
  border-radius:7px;padding:8px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s}
.btn-logout:hover{background:rgba(231,76,60,.3)}

/* ===================== MAIN ===================== */
.main-content{margin-right:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.top-bar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.top-bar h1{font-size:18px;font-weight:700;color:var(--primary)}
.top-bar-left{display:flex;align-items:center;gap:10px}
.top-bar-right{display:flex;align-items:center;gap:8px}
.page-body{padding:24px;flex:1}
.mobile-menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--primary);padding:4px}
#sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}

/* ===================== CARDS ===================== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border-light);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-title{font-size:14.5px;font-weight:700;color:var(--primary)}
.card-body{padding:18px}

/* ===================== STAT CARDS ===================== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px;margin-bottom:22px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px 18px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  border-right:4px solid transparent;transition:transform .2s,box-shadow .2s;cursor:default}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card.c-blue{border-right-color:var(--info)}
.stat-card.c-orange{border-right-color:var(--accent)}
.stat-card.c-green{border-right-color:var(--success)}
.stat-card.c-purple{border-right-color:var(--purple)}
.stat-card.c-red{border-right-color:var(--danger)}
.stat-card.c-teal{border-right-color:#00b894}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.c-blue .stat-icon{background:#ebf5fb}.c-orange .stat-icon{background:#fef3e7}
.c-green .stat-icon{background:#eafaf1}.c-purple .stat-icon{background:#f5eef8}
.c-red .stat-icon{background:#fdedec}.c-teal .stat-icon{background:#e0fdf4}
.stat-val{font-size:26px;font-weight:700;color:var(--primary);line-height:1}
.stat-lbl{font-size:11.5px;color:var(--text-light);margin-top:3px}

/* ===================== TABLES ===================== */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead tr{background:#f8fafc}
th{padding:10px 13px;text-align:right;font-weight:700;color:var(--text-light);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--border-light);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfd}
.tbl-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tbl-empty{text-align:center;padding:50px 20px;color:var(--text-light)}
.tbl-empty .ei{font-size:44px;margin-bottom:10px}

/* ===================== BADGES ===================== */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.b-success{background:#eafaf1;color:var(--success)}
.b-warning{background:#fef9e7;color:#b7770d}
.b-danger{background:#fdedec;color:var(--danger)}
.b-info{background:#ebf5fb;color:var(--info)}
.b-secondary{background:#f0f2f7;color:var(--text-light)}
.b-purple{background:#f5eef8;color:var(--purple)}

/* ===================== FILTER BAR ===================== */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f-input{padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;
  font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);background:#fafbfd;
  transition:border-color .2s;direction:rtl}
.f-input:focus{outline:none;border-color:var(--accent)}
.f-input[type=search]{width:200px}
.f-select{padding:7px 11px;border:1.5px solid var(--border);border-radius:7px;
  font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);background:#fafbfd;
  cursor:pointer;direction:rtl}
.f-select:focus{outline:none;border-color:var(--accent)}

/* ===================== MODAL ===================== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:92vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:mIn .22s ease}
.modal-box.wide{max-width:720px}
.modal-box.full{max-width:95vw}
@keyframes mIn{from{opacity:0;transform:translateY(-18px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-head h3{font-size:15.5px;font-weight:700;color:var(--primary)}
.modal-close{background:#f0f2f7;border:none;width:28px;height:28px;border-radius:6px;
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text-light);transition:all .2s;line-height:1}
.modal-close:hover{background:#fde8e8;color:var(--danger)}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}

/* ===================== CONFIRM ===================== */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:1100;
  display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.confirm-box{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:360px;
  text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:mIn .2s ease}
.confirm-icon{font-size:46px;margin-bottom:10px}
.confirm-box h3{font-size:17px;font-weight:700;color:var(--primary);margin-bottom:6px}
.confirm-box p{font-size:13px;color:var(--text-light);margin-bottom:20px}
.confirm-actions{display:flex;gap:10px;justify-content:center}

/* ===================== TOAST ===================== */
#toastBox{position:fixed;bottom:22px;left:22px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;color:#fff;
  min-width:200px;box-shadow:0 4px 16px rgba(0,0,0,.22);animation:tIn .28s ease;
  display:flex;align-items:center;gap:8px}
@keyframes tIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.t-success{background:var(--success)}.t-error{background:var(--danger)}.t-info{background:var(--info)}.t-warning{background:var(--warning)}

/* ===================== PERMISSIONS UI ===================== */
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.perm-section{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.perm-sec-head{background:#f8fafc;padding:9px 13px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border)}
.perm-sec-head strong{font-size:13px;flex:1}
.perm-sec-head .perm-toggle{font-size:11px;color:var(--info);cursor:pointer;border:none;
  background:none;font-family:'Cairo',sans-serif;font-weight:600;padding:0}
.perm-sec-head .perm-toggle:hover{text-decoration:underline}
.perm-checks{padding:10px 13px;display:flex;flex-direction:column;gap:7px}
.perm-cb{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
.perm-cb input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}

/* ===================== ALERTS ===================== */
.alert-list{display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;
  border-right:3px solid transparent}
.alert-item.al-warn{background:#fef9e7;border-right-color:var(--warning)}
.alert-item.al-danger{background:#fdedec;border-right-color:var(--danger)}
.alert-item.al-info{background:#ebf5fb;border-right-color:var(--info)}
.alert-item .al-icon{font-size:22px;flex-shrink:0}
.alert-item .al-text strong{display:block;font-size:13px;color:var(--text)}
.alert-item .al-text span{font-size:12px;color:var(--text-light)}

/* ===================== TANK BAR ===================== */
.tank-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.tank-name{font-weight:700;font-size:14px;color:var(--primary);margin-bottom:2px}
.tank-type{font-size:12px;color:var(--text-light);margin-bottom:10px}
.tank-nums{display:flex;justify-content:space-between;font-size:12px;color:var(--text-light);margin-bottom:5px}
.tank-bar{height:14px;background:#e2e8f0;border-radius:8px;overflow:hidden}
.tank-fill{height:100%;border-radius:8px;transition:width .5s}
.tank-fill.tf-green{background:linear-gradient(90deg,var(--success),#2ecc71)}
.tank-fill.tf-yellow{background:linear-gradient(90deg,var(--warning),#f1c40f)}
.tank-fill.tf-red{background:linear-gradient(90deg,var(--danger),#e74c3c)}
.tank-pct{font-size:12px;font-weight:700;margin-top:4px;text-align:left}
.tanks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:22px}

/* ===================== ATTACHMENTS ===================== */
.att-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.att-item{display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:#f8fafc;border:1px solid var(--border);border-radius:7px}
.att-icon{font-size:20px;flex-shrink:0}
.att-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-size{font-size:11px;color:var(--text-light);flex-shrink:0}
.att-actions{display:flex;gap:5px;flex-shrink:0}
.upload-area{border:2px dashed var(--border);border-radius:8px;padding:20px;text-align:center;
  cursor:pointer;transition:border-color .2s;color:var(--text-light);font-size:13px}
.upload-area:hover{border-color:var(--accent);color:var(--accent)}

/* ===================== PHOTO ===================== */
.vehicle-photo{width:48px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.photo-preview{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:8px;
  border:1px solid var(--border);display:none}
.photo-preview.show{display:block}

/* ===================== NOTE ITEM ===================== */
.note-item{background:#fafbfd;border:1px solid var(--border);border-radius:8px;padding:13px;margin-bottom:8px}
.note-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.note-author{font-size:12px;color:var(--text-light)}
.note-text{font-size:13.5px;line-height:1.6}

/* ===================== PROGRESS BADGE ===================== */
.progress-wrap{min-width:80px}
.progress-bar{height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:3px}
.progress-fill{height:100%;border-radius:4px;transition:width .4s}

/* ===================== MISC ===================== */
.code-tag{background:#f0f2f7;padding:2px 7px;border-radius:5px;font-family:monospace;font-size:12px}
.text-muted{color:var(--text-light)}
.text-success{color:var(--success)}.text-danger{color:var(--danger)}.text-warning{color:#b7770d}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:14px}
.mb-0{margin-bottom:0!important}
.d-flex{display:flex}.align-center{align-items:center}.gap-2{gap:8px}.gap-1{gap:4px}
.flex-1{flex:1}.ml-auto{margin-right:auto}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.fw-bold{font-weight:700}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-row{display:flex;flex-direction:column;gap:2px;padding:10px;background:#f8fafc;border-radius:7px}
.info-label{font-size:11px;color:var(--text-light);font-weight:600}
.info-value{font-size:13.5px;font-weight:600;color:var(--text)}

/* ===================== RESPONSIVE ===================== */
@media(max-width:900px){
  .grid-2,.grid-3{grid-template-columns:1fr}
  .perm-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0)}
  #sidebarOverlay.show{display:block}
  .main-content{margin-right:0}
  .page-body{padding:14px}
  .mobile-menu-btn{display:block}
  .stat-grid{grid-template-columns:1fr 1fr}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .top-bar{padding:0 14px}
  .tanks-grid{grid-template-columns:1fr}
}
@media(max-width:480px){

/* ============================================================
   CRYPTO — SHA-256
   ============================================================ */
function _sha256js(s){
  function r(n,d){return(n>>>d)|(n<<(32-d));}
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const by=[];
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);if(c<0x80)by.push(c);else if(c<0x800)by.push(0xc0|(c>>6),0x80|(c&0x3f));else if(c<0x10000)by.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));else by.push(0xf0|(c>>18),0x80|((c>>12)&0x3f),0x80|((c>>6)&0x3f),0x80|(c&0x3f));}
  const L=by.length;by.push(0x80);
  while(by.length%64!==56)by.push(0);
  const bL=L*8;by.push(0,0,0,0,(bL>>>24)&0xff,(bL>>>16)&0xff,(bL>>>8)&0xff,bL&0xff);
  for(let i=0;i<by.length;i+=64){
    const W=[];
    for(let j=0;j<16;j++)W.push((by[i+j*4]<<24)|(by[i+j*4+1]<<16)|(by[i+j*4+2]<<8)|by[i+j*4+3]);
    for(let j=16;j<64;j++)W.push(((r(W[j-2],17)^r(W[j-2],19)^(W[j-2]>>>10))+W[j-7]+(r(W[j-15],7)^r(W[j-15],18)^(W[j-15]>>>3))+W[j-16])|0);
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let j=0;j<64;j++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[j]+W[j])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
async function hashPwd(raw){
  const msg='fms_v2_salt::'+raw;
  if(typeof crypto!=='undefined'&&crypto.subtle){
    try{const enc=new TextEncoder(),buf=await crypto.subtle.digest('SHA-256',enc.encode(msg));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}catch{}
  }
  return _sha256js(msg);
}
function isHashed(s){return typeof s==='string'&&s.length===64&&/^[0-9a-f]+$/.test(s);}

/* ============================================================

const DB={
  _k:t=>'fm2_'+t,
  get(t){try{return JSON.parse(localStorage.getItem(this._k(t))||'[]');}catch{return[];}},
  set(t,d){try{localStorage.setItem(this._k(t),JSON.stringify(d));}catch{}},
  all(t){return this.get(t);},
  find(t,id){return this.get(t).find(r=>r.id===id);},
  add(t,item){
    const d=this.get(t);
    item.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    item.createdAt=new Date().toISOString();
    d.push(item);this.set(t,d);return item;
  },
  update(t,id,u){
    const d=this.get(t),i=d.findIndex(r=>r.id===id);
    if(i===-1)return null;
    d[i]={...d[i],...u,updatedAt:new Date().toISOString()};
    this.set(t,d);return d[i];
  },
  del(t,id){this.set(t,this.get(t).filter(r=>r.id!==id));},
  cfg:{
    get(k){try{return JSON.parse(localStorage.getItem('fm2_cfg_'+k)||'null');}catch{return null;}},
    set(k,v){localStorage.setItem('fm2_cfg_'+k,JSON.stringify(v));}

/* ============================================================
   AUTH
   ============================================================ */
let currentUser=null;

async function doLogin(username,password){
  const users=DB.get('users');
  const user=users.find(u=>u.username.toLowerCase()===username.toLowerCase());
  if(!user)return false;
  const h=await hashPwd(password);
  if(user.password!==h)return false;
  currentUser=user;
  sessionStorage.setItem('fm2_sess',JSON.stringify({id:user.id}));
  logAct('تسجيل دخول','');
  return true;
}

function logout(){
  logAct('تسجيل خروج','');
  currentUser=null;
  sessionStorage.removeItem('fm2_sess');
  showLogin();
}

function checkSession(){
  try{
    const s=JSON.parse(sessionStorage.getItem('fm2_sess')||'null');
    if(!s)return false;
    const u=DB.find('users',s.id);
    if(!u)return false;
    currentUser=u;return true;
  }catch{return false;}
}

function isOwner(){return currentUser?.role==='owner';}
function can(perm){
  if(!currentUser)return false;
  if(currentUser.role==='owner')return true;
  return !!(currentUser.permissions&&currentUser.permissions[perm]);
}

/* ============================================================
   INIT / MIGRATION
   ============================================================ */
async function initApp(){
  // Migrate plaintext passwords
  const users=DB.get('users');
  let changed=false;
  for(const u of users){
    if(u.password&&!isHashed(u.password)){
      u.password=await hashPwd(u.password);changed=true;
    }
    // Give legacy admin/user full or default perms
    if(!u.permissions){
      u.permissions=u.role==='admin'?getAllPerms():{};changed=true;
    }
  }
  if(changed)DB.set('users',users);

  // Ensure owner exists
  if(!DB.all('users').find(u=>u.role==='owner')){
    const hp=await hashPwd('owner@2024');
    const all=DB.get('users');
    all.unshift({id:'_owner_',username:'owner',password:hp,name:'المالك الرئيسي',
      role:'owner',permissions:getAllPerms(),createdAt:new Date().toISOString()});
    DB.set('users',all);
  }

  // Seed groups
  if(DB.get('groups').length===0){
    ['قلابات','شيولات','حفارات','معدات ثقيلة','سيارات خدمة'].forEach(name=>DB.add('groups',{name}));
  }
}

function toast(msg,type='success'){
  const icons={success:'✅',error:'❌',info:'ℹ️',warning:'⚠️'};
  const el=document.createElement('div');
  el.className=`toast t-${type}`;
  const ic=document.createElement('span');ic.textContent=icons[type]||'•';
  const tx=document.createElement('span');tx.textContent=msg;
  el.appendChild(ic);el.appendChild(tx);
  document.getElementById('toastBox').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(-16px)';
    el.style.transition='.3s';setTimeout(()=>el.remove(),320);},3200);
}

/* ---- Helpers ---- */
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function fmtDate(v){
  if(!v)return'-';
  try{return new Date(v).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'});}
  catch{return v;}
}
function fmtDateTime(v){
  if(!v)return'-';
  try{const d=new Date(v);return d.toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'})+' '+d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}
  catch{return v;}
}
function fmtNum(n){return parseFloat(n||0).toLocaleString('ar');}
function daysUntil(dateStr){
  if(!dateStr)return null;
  const [y,m,d]=dateStr.split('-').map(Number);
  const target=new Date(y,m-1,d);
  const now=new Date();now.setHours(0,0,0,0);
  const diff=target-now;
  return Math.ceil(diff/(1000*60*60*24));
}
function fileIcon(type){
  if(!type)return'📎';
  if(type.includes('pdf'))return'📄';
  if(type.includes('image'))return'🖼️';
  return'📎';
}
function fmtFileSize(bytes){
  if(!bytes)return'';
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return(bytes/1024).toFixed(1)+'KB';
  return(bytes/(1024*1024)).toFixed(1)+'MB';
}

async function changeMyPassword(){
  if(currentUser?.role!=='owner'&&currentUser?.role!=='admin'){
    toast('ليس لديك صلاحية','error');
    return;
  }
  openModal('🔑 تغيير كلمة المرور',`
    <div class="form-group"><label>كلمة المرور الحالية <span class="req">*</span></label>
      <input class="form-control" type="password" id="cpwd_cur" autocomplete="current-password"></div>
    <div class="form-group"><label>كلمة المرور الجديدة <span class="req">*</span></label>
      <input class="form-control" type="password" id="cpwd_new" autocomplete="new-password"></div>
    <div class="form-group"><label>تأكيد كلمة المرور الجديدة <span class="req">*</span></label>
      <input class="form-control" type="password" id="cpwd_con" autocomplete="new-password"></div>`,
    'حفظ', async ()=>{
      const cur=document.getElementById('cpwd_cur').value;
      const nw=document.getElementById('cpwd_new').value;
      const con=document.getElementById('cpwd_con').value;
      if(!cur||!nw||!con){toast('أدخل جميع الحقول','error');return;}
      if(nw.length<6){toast('كلمة المرور الجديدة 6 أحرف على الأقل','error');return;}
      if(nw!==con){toast('كلمتا المرور غير متطابقتين','error');return;}
      const h=await hashPwd(cur);
      const u=DB.find('users',currentUser.id);
      if(u?.password!==h){toast('كلمة المرور الحالية غير صحيحة','error');return;}
      try{
        const nh=await hashPwd(nw);
        DB.update('users',currentUser.id,{password:nh});
        currentUser={...currentUser,password:nh};
        logAct('تغيير كلمة المرور','');
        toast('✅ تم تغيير كلمة المرور بنجاح');
        closeModal();
      }catch{toast('خطأ في تشفير كلمة المرور','error');}
    });
}

  reports:'التقارير',drivers:'إدارة السائقين',fuelMovement:'سجل حركة الوقود',
  users:'إدارة المستخدمين',activity:'سجل النشاط',
  settings:'الإعدادات',backup:'النسخ الاحتياطي',

function navigate(page,...args){
  currentPage=page;
  const item=NAV_ITEMS.find(n=>n.page===page);
  if(item){
    if(item.ownerOnly&&!isOwner()){toast('هذه الصفحة للمالك الرئيسي فقط','error');return;}
    if(item.perm&&!can(item.perm)){toast('ليس لديك صلاحية الوصول','error');return;}
  }
  closeSidebar();
  setActiveNav(page);
  document.getElementById('pageTitle').textContent=PAGE_TITLES[page]||'';
  document.getElementById('topActions').innerHTML='';
  const renders={
    dashboard:renderDashboard,driverDashboard:renderDriverDashboard,
    projects:renderProjects,groups:renderGroups,
    vehicles:renderVehicles,tanks:renderTanks,fuel:renderFuel,
    maintenance:renderMaintenance,notes:renderNotes,invoices:renderInvoices,
    reports:renderReports,drivers:renderDrivers,fuelMovement:renderFuelMovement,
    users:renderUsers,activity:renderActivity,
    settings:renderSettings,backup:renderBackup,
  };
  if(renders[page])renders[page](...args);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(){
  const vehicles=DB.all('vehicles').filter(v=>!v.archived);
  const fuel=DB.all('fuel').filter(r=>r.approvalStatus==='approved'||!r.approvalStatus);
  const projects=DB.all('projects');
  const maint=DB.all('maintenance');
  const tanks=DB.all('tanks');
  const s=getSettings();
  const alertDays=parseInt(s.alert_days||30,10);
  const unfueledDays=parseInt(s.unfueled_days||14,10);
  const tankAlertPct=parseInt(s.tank_alert_pct||20,10);

  const totalFuelCost=fuel.reduce((a,r)=>a+(parseFloat(r.cost)||0),0);
  const totalMaintCost=maint.reduce((a,r)=>a+(parseFloat(r.cost)||0),0);

  // Build alerts
  const alerts=[];
  const now=new Date();

  vehicles.forEach(v=>{
    // Registration expiry
    if(v.registrationExpiry){
      const d=daysUntil(v.registrationExpiry);
      if(d!==null&&d<=alertDays){
        const cls=d<=7?'al-danger':'al-warn';
        const txt=d<=0?`انتهت استمارة ${esc(v.name)}`:`ستنتهي استمارة ${esc(v.name)} خلال ${d} يوم`;
        alerts.push({cls,icon:'📋',text:txt,sub:`تاريخ الانتهاء: ${fmtDate(v.registrationExpiry)}`});
      }
    }
    // Insurance expiry
    if(v.insuranceExpiry){
      const d=daysUntil(v.insuranceExpiry);
      if(d!==null&&d<=alertDays){
        const cls=d<=7?'al-danger':'al-warn';
        const txt=d<=0?`انتهى تأمين ${esc(v.name)}`:`سينتهي تأمين ${esc(v.name)} خلال ${d} يوم`;
        alerts.push({cls,icon:'🛡️',text:txt,sub:`شركة التأمين: ${esc(v.insuranceCompany||'-')}`});
      }
    }
    // Unfueled vehicles
    const vFuel=fuel.filter(f=>f.vehicleId===v.id).sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));
    if(vFuel.length>0){
      const lastDate=new Date(vFuel[0].date||vFuel[0].createdAt);
      const daysSince=Math.floor((now-lastDate)/(1000*60*60*24));
      if(daysSince>unfueledDays){
        alerts.push({cls:'al-info',icon:'⛽',text:`${esc(v.name)} لم يتم تعبئتها منذ ${daysSince} يوم`,sub:'يُرجى المتابعة'});
      }
    }
    // Stopped
    if(v.status==='stopped'){
      alerts.push({cls:'al-info',icon:'🔴',text:`${esc(v.name)} متوقفة`,sub:`اللوحة: ${esc(v.plate||'-')}`});
    }
  });

  // Upcoming maintenance
  maint.forEach(m=>{
    if(m.nextDate){
      const d=daysUntil(m.nextDate);
      if(d!==null&&d<=alertDays&&d>0){
        const v=DB.find('vehicles',m.vehicleId);
        alerts.push({cls:'al-warn',icon:'🔧',text:`صيانة قادمة لـ ${esc(v?.name||'-')} خلال ${d} يوم`,sub:fmtDate(m.nextDate)});
      }
    }
  });

  // Pending approvals alert
  if(can('fuel_approve')||isOwner()){
    const pendingCount=DB.all('fuel').filter(r=>!r.approvalStatus||r.approvalStatus==='pending').length;
    if(pendingCount>0)alerts.push({cls:'al-warn',icon:'✅',text:`${pendingCount} تعبئة بانتظار الاعتماد`,sub:'انقر لمراجعة واعتماد التعبئات'});
  }
  // Tank alerts
  tanks.forEach(tk=>{
    const pct=tk.capacity>0?Math.round((tk.currentLevel/tk.capacity)*100):0;
    if(pct<=tankAlertPct){
      alerts.push({cls:'al-danger',icon:'🛢️',text:`تانكي ${esc(tk.name)} منخفض (${pct}%)`,
        sub:`الكمية المتبقية: ${fmtNum(tk.currentLevel)} لتر`});
    }
  });

  // Recent fuel
  const recentFuel=[...fuel].sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt)).slice(0,5);

  // Tanks section
  const tanksHtml=tanks.length>0?`
    <div class="card">
      <div class="card-header"><span class="card-title">🛢️ حالة التانكيات</span>
        ${can('tanks_view')?`<button class="btn btn-sm btn-secondary" onclick="navigate('tanks')">عرض الكل</button>`:''}
      </div>
      <div class="card-body">
        <div class="tanks-grid">
          ${tanks.map(tk=>{
            const pct=tk.capacity>0?Math.min(100,Math.round((tk.currentLevel/tk.capacity)*100)):0;
            const cls=pct>50?'tf-green':pct>20?'tf-yellow':'tf-red';
            return`<div class="tank-card">
              <div class="tank-name">${esc(tk.name)}</div>
              <div class="tank-type">${esc(tk.fuelType)}</div>
              <div class="tank-nums"><span>الكمية: <strong>${fmtNum(tk.currentLevel)} لتر</strong></span><span>السعة: ${fmtNum(tk.capacity)}</span></div>
              <div class="tank-bar"><div class="tank-fill ${cls}" style="width:${pct}%"></div></div>
              <div class="tank-pct" style="color:${pct>50?'var(--success)':pct>20?'var(--warning)':'var(--danger)'}">${pct}% ممتلئ — متبقٍ: ${fmtNum(tk.capacity-tk.currentLevel)} لتر</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`:'';

  document.getElementById('pageBody').innerHTML=`
    <div class="stat-grid">
      <div class="stat-card c-blue"><div class="stat-icon">🚛</div><div><div class="stat-val">${vehicles.length}</div><div class="stat-lbl">إجمالي السيارات</div></div></div>
      <div class="stat-card c-orange"><div class="stat-icon">🏗️</div><div><div class="stat-val">${projects.length}</div><div class="stat-lbl">المشاريع</div></div></div>
      <div class="stat-card c-green"><div class="stat-icon">⛽</div><div><div class="stat-val">${fuel.length}</div><div class="stat-lbl">عمليات التعبئة</div></div></div>
      <div class="stat-card c-purple"><div class="stat-icon">🔧</div><div><div class="stat-val">${maint.length}</div><div class="stat-lbl">سجلات الصيانة</div></div></div>
      <div class="stat-card c-red"><div class="stat-icon">💰</div><div><div class="stat-val">${fmtNum(totalFuelCost)}</div><div class="stat-lbl">تكلفة الوقود (ر.س)</div></div></div>
      <div class="stat-card c-teal"><div class="stat-icon">🛠️</div><div><div class="stat-val">${fmtNum(totalMaintCost)}</div><div class="stat-lbl">تكلفة الصيانة (ر.س)</div></div></div>
    </div>

    ${alerts.length>0?`
    <div class="card">
      <div class="card-header"><span class="card-title">🔔 مركز التنبيهات</span>
        <span class="badge b-danger">${alerts.length} تنبيه</span></div>
      <div class="card-body">
        <div class="alert-list">
          ${alerts.map(a=>`<div class="alert-item ${a.cls}">
            <div class="al-icon">${a.icon}</div>
            <div class="al-text"><strong>${a.text}</strong><span>${a.sub||''}</span></div>
          </div>`).join('')}
        </div>
      </div>
    </div>`:''}

    ${tanksHtml}

    <div class="grid-2">
      <div class="card">
        <div class="card-header"><span class="card-title">حالة السيارات</span></div>
        <div class="card-body">
          <div class="grid-3">
            <div style="text-align:center;background:#eafaf1;border-radius:8px;padding:14px">
              <div style="font-size:26px;font-weight:700;color:var(--success)">${vehicles.filter(v=>v.status==='working').length}</div>
              <div style="font-size:12px;color:var(--text-light)">✅ تعمل</div>
            </div>
            <div style="text-align:center;background:#fef9e7;border-radius:8px;padding:14px">
              <div style="font-size:26px;font-weight:700;color:var(--warning)">${vehicles.filter(v=>v.status==='maintenance').length}</div>
              <div style="font-size:12px;color:var(--text-light)">🔧 صيانة</div>
            </div>
            <div style="text-align:center;background:#fdedec;border-radius:8px;padding:14px">
              <div style="font-size:26px;font-weight:700;color:var(--danger)">${vehicles.filter(v=>v.status==='stopped').length}</div>
              <div style="font-size:12px;color:var(--text-light)">🔴 متوقفة</div>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">آخر التعبئات</span>
          ${can('fuel_view')?`<button class="btn btn-sm btn-info" onclick="navigate('fuel')">الكل</button>`:''}</div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>السيارة</th><th>الكمية</th><th>التكلفة</th><th>التاريخ</th></tr></thead>
            <tbody>
              ${recentFuel.length===0?`<tr><td colspan="4" class="tbl-empty"><div class="ei">⛽</div><p>لا توجد تعبئات</p></td></tr>`:
                recentFuel.map(r=>{const v=DB.find('vehicles',r.vehicleId);return`<tr>
                  <td>${v?esc(v.name):'<em class="text-muted">محذوفة</em>'}</td>
                  <td>${fmtNum(r.quantity)} لتر</td>
                  <td>${fmtNum(r.cost)} ر.س</td>
                  <td>${fmtDate(r.date||r.createdAt)}</td>
                </tr>`;}).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

/* ============================================================
   ATTACHMENTS HELPER
   ============================================================ */
function uploadAttachment(entityType,entityId,onDone){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.pdf,.jpg,.jpeg,.png';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>5*1024*1024){toast('حجم الملف أكبر من 5MB','error');return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      const att=DB.add('attachments',{
        entityType,entityId,name:file.name,
        fileType:file.type,data:ev.target.result,
        size:file.size,userId:currentUser.id,userName:currentUser.name
      });
      logAct('رفع مرفق',`${file.name}`);
      toast('تم رفع الملف بنجاح');
      if(onDone)onDone(att);
    };
    reader.onerror=()=>toast('فشل قراءة الملف','error');
    reader.readAsDataURL(file);
  };
  inp.click();
}

function renderAttachments(entityType,entityId,canAdd,canDelete){
  const atts=DB.all('attachments').filter(a=>a.entityType===entityType&&a.entityId===entityId);
  return`<div>
    ${canAdd?`<button class="btn btn-sm btn-info" onclick="uploadAttachment('${entityType}','${entityId}',()=>navigate(currentPage))">📎 إرفاق ملف</button>`:''}
    <div class="att-list mt-2">
      ${atts.length===0?`<p class="text-muted" style="font-size:13px">لا توجد مرفقات</p>`:
        atts.map(a=>`<div class="att-item">
          <span class="att-icon">${fileIcon(a.fileType)}</span>
          <span class="att-name">${esc(a.name)}</span>
          <span class="att-size">${fmtFileSize(a.size)}</span>
          <div class="att-actions">
            <a href="${a.data}" download="${esc(a.name)}" class="btn btn-sm btn-secondary">⬇️</a>
            ${canDelete?`<button class="btn btn-sm btn-danger" onclick="deleteAttachment('${a.id}','${entityType}','${entityId}')">🗑️</button>`:''}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

let currentPage='dashboard';
function deleteAttachment(id,entityType,entityId){
  confirm2('حذف هذا المرفق؟',()=>{
    DB.del('attachments',id);
    logAct('حذف مرفق','');
    toast('تم حذف المرفق');
    const _mo=document.getElementById('modalOverlay').style.display==='flex';
    if(_mo){document.getElementById('modalBody').innerHTML=renderAttachments(entityType,entityId,can(entityType+'s_add'),can(entityType+'s_delete'));}
    else navigate(currentPage);
  });
}

function getLinkedDriver(){
  if(!currentUser)return null;
  return DB.all('drivers').find(d=>d.userId===currentUser.id&&d.status!=='inactive')||null;
}
function getDriverVehicleIds(){
  const d=getLinkedDriver();
  return d?d.vehicleIds||[]:null;
}
function filterByDriverAccess(vehicles){
  const ids=getDriverVehicleIds();
  if(ids===null)return vehicles;
  return vehicles.filter(v=>ids.includes(v.id));
}
function isDriverUser(){ return !!getLinkedDriver(); }

function renderDrivers(){

  if(can('drivers_add'))document.getElementById('topActions').innerHTML=
    `<button class="btn btn-primary" onclick="openDriverModal()">+ إضافة سائق</button>`;
  const drivers=DB.all('drivers');
  const vehicles=DB.all('vehicles').filter(v=>!v.archived);
  const users=DB.all('users');
  document.getElementById('pageBody').innerHTML=`
    <div class="card">
      <div class="card-header"><span class="card-title">السائقون (${drivers.length})</span>

function renderDrvRows(list){
  const vehicles=DB.all('vehicles');const users=DB.all('users');
  return list.map((d,i)=>{
    const vNames=(d.vehicleIds||[]).map(vid=>{const v=DB.find('vehicles',vid);return v?`<span class="badge b-info" style="margin:1px">${esc(v.name)}</span>`:null;}).filter(Boolean).join('');
    const u=d.userId?DB.find('users',d.userId):null;
    const stBadge=d.status==='inactive'?'<span class="badge b-secondary">غير نشط</span>':'<span class="badge b-success">نشط</span>';
    return`<tr><td>${i+1}</td>
      <td><strong>${esc(d.name)}</strong>${d.notes?`<div class="text-muted" style="font-size:11px">${esc(d.notes)}</div>`:''}</td>
      <td>${esc(d.phone||'-')}</td>
      <td>${vNames||'<span class="text-muted">لا يوجد</span>'}</td>
      <td>${u
        ?`<div><span class="code-tag">${esc(u.username)}</span><br>
           <button class="btn btn-sm btn-secondary" style="margin-top:4px;font-size:11px" onclick="resetDriverPassword('${u.id}')">🔑 تغيير كلمة المرور</button>
          </div>`
        :`<button class="btn btn-sm btn-warning" onclick="openDriverModal('${d.id}')">⚠️ إنشاء حساب</button>`
      }</td>
      <td>${stBadge}</td>
      <td class="tbl-actions">
        ${can('drivers_edit')?`<button class="btn btn-sm btn-info" onclick="openDriverModal('${d.id}')">✏️</button>`:''}
        ${can('drivers_delete')?`<button class="btn btn-sm btn-danger" onclick="confirmDelDriver('${d.id}')">🗑️</button>`:''}
      </td></tr>`;}).join('');
}
function filterDrivers(){
  const q=document.getElementById('drvS').value.toLowerCase();
  document.getElementById('drvTb').innerHTML=renderDrvRows(DB.all('drivers').filter(d=>d.name.toLowerCase().includes(q)||(d.phone||'').includes(q)));
}
function genDriverUsername(name){
  const base=(name.trim().split(' ')[0]||'driver').slice(0,8);
  return 'drv_'+base+'_'+Math.random().toString(36).slice(2,6);
}
function genDriverPassword(){
  const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789@#!';
  return Array.from({length:10},()=>c[Math.floor(Math.random()*c.length)]).join('');
}

async function saveDriver(id){
  const name=document.getElementById('dm_n').value.trim();
  if(!name){toast('أدخل اسم السائق','error');return;}
  const vehicleIds=Array.from(document.querySelectorAll('[name^="dv_"]:checked')).map(cb=>cb.name.replace('dv_',''));
  const existing=id?DB.find('drivers',id):null;
  let userId=existing?.userId||null;
  let plainPassword=null;

  if(!userId){
    const username=genDriverUsername(name);
    plainPassword=genDriverPassword();
    let hashed;
    try{hashed=await hashPwd(plainPassword);}
    catch{toast('خطأ في تشفير كلمة المرور — تأكد من استخدام HTTPS','error');return;}
    const newUser=DB.add('users',{
      name,username,password:hashed,role:'user',
      permissions:{vehicles_view:true,fuel_view:true,fuel_add:true,notes_view:true,notes_add:true}
    });
    userId=newUser.id;
    logAct('إنشاء حساب سائق',username);
  }

  const data={name,phone:document.getElementById('dm_ph').value.trim(),
    status:document.getElementById('dm_st').value,
    userId,vehicleIds,notes:document.getElementById('dm_no').value.trim()};

  if(id){DB.update('drivers',id,data);logAct('تعديل سائق',name);}
  else{DB.add('drivers',data);logAct('إضافة سائق',name);}

  closeModal();

  if(plainPassword){
    const u=DB.find('users',userId);
    openModal('✅ تم إنشاء حساب السائق',`
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:48px">🎉</div>
        <p style="font-size:15px;font-weight:700;color:var(--primary);margin-top:8px">تم إنشاء الحساب بنجاح!</p>
        <p style="color:var(--text-light);font-size:13px">سلّم هذه البيانات للسائق</p>
      </div>
      <div style="background:#f8fafc;border-radius:10px;padding:20px;border:2px dashed var(--border)">
        <div style="margin-bottom:14px">
          <div style="font-size:12px;color:var(--text-light);font-weight:700;margin-bottom:4px">👤 اسم المستخدم</div>
          <div style="font-size:20px;font-weight:700;color:var(--primary);font-family:monospace;letter-spacing:1px">${esc(u?.username||'')}</div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text-light);font-weight:700;margin-bottom:4px">🔑 كلمة المرور</div>
          <div style="font-size:20px;font-weight:700;color:var(--accent);font-family:monospace;letter-spacing:1px">${esc(plainPassword)}</div>
        </div>
      </div>
      <div style="background:#fef9e7;border-radius:8px;padding:10px 14px;margin-top:12px;font-size:13px;color:#b7770d;text-align:center">
        ⚠️ هذه المعلومات لن تُعرض مرة أخرى — احفظها الآن
      </div>`,null,null);
  }
  renderDrivers();
}

async function resetDriverPassword(userId){
  const plain=genDriverPassword();
  let _hashed;
  try{_hashed=await hashPwd(plain);}
  catch{toast('خطأ في تشفير كلمة المرور — تأكد من استخدام HTTPS','error');return;}
  DB.update('users',userId,{password:_hashed});
  const u=DB.find('users',userId);
  logAct('إعادة تعيين كلمة مرور سائق',u?.username||'');
  closeModal();
  openModal('🔑 كلمة المرور الجديدة',`
    <div style="text-align:center">
      <div style="font-size:42px;margin-bottom:8px">🔑</div>
      <p style="color:var(--text-light);font-size:13px;margin-bottom:16px">كلمة المرور الجديدة لـ <strong>${esc(u?.name||'')}</strong></p>
      <div style="background:#f8fafc;border-radius:10px;padding:20px;border:2px dashed var(--border)">
        <div style="font-size:12px;color:var(--text-light);margin-bottom:6px">👤 ${esc(u?.username||'')}</div>
        <div style="font-size:22px;font-weight:700;color:var(--accent);font-family:monospace;letter-spacing:2px">${esc(plain)}</div>
      </div>
      <div style="background:#fef9e7;border-radius:8px;padding:10px;margin-top:12px;font-size:13px;color:#b7770d">
        ⚠️ لن تُعرض مرة أخرى — احفظها الآن
      </div>
    </div>`,null,null);
}

function confirmDelDriver(id){
  const d=DB.find('drivers',id);
  const linkedUser=d?.userId?DB.find('users',d.userId):null;
  confirm2(`حذف سائق "${d?.name}"؟${linkedUser?' سيُحذف حسابه ('+linkedUser.username+') أيضاً.':''}`,()=>{
    if(d?.userId){const u=DB.find('users',d.userId);if(u&&u.role!=='owner')DB.del('users',d.userId);}
    DB.del('drivers',id);
    logAct('حذف سائق',d?.name||'');
    toast('تم حذف السائق وحسابه');
    renderDrivers();
  });
}

    .sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));
  const totalL=myFuel.reduce((s,r)=>s+(parseFloat(r.quantity)||0),0);
  const totalC=myFuel.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
  const pendingMy=myFuel.filter(r=>r.approvalStatus==='pending'||!r.approvalStatus).length;
  const approvedMy=myFuel.filter(r=>r.approvalStatus==='approved').length;

      <div class="stat-card c-green"><div class="stat-icon">⛽</div><div><div class="stat-val">${myFuel.length}</div><div class="stat-lbl">تعبئاتي</div></div></div>

/* ============================================================
   PROJECTS
   ============================================================ */
const PRJ_ST={active:'نشط',completed:'مكتمل',suspended:'موقوف'};
const PRJ_SB={active:'b-success',completed:'b-info',suspended:'b-warning'};

function renderProjects(){
  if(!can('projects_view')){toast('ليس لديك صلاحية','error');navigate('dashboard');return;}
  if(can('projects_add'))document.getElementById('topActions').innerHTML=`<button class="btn btn-primary" onclick="openProjectModal()">+ إضافة مشروع</button>`;
  const projects=DB.all('projects');
  document.getElementById('pageBody').innerHTML=`
    <div class="card">
      <div class="card-header"><span class="card-title">المشاريع (${projects.length})</span>
        <input class="f-input" type="search" id="prjS" placeholder="🔍 بحث..." oninput="filterProjects()" onsearch="filterProjects()"></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>اسم المشروع</th><th>الموقع</th><th>رقم العقد</th><th>الحالة</th><th>السيارات</th><th>الإجراءات</th></tr></thead>
        <tbody id="prjTb">${renderPrjRows(projects)}</tbody>
      </table>${projects.length===0?`<div class="tbl-empty"><div class="ei">🏗️</div><p>لا توجد مشاريع</p></div>`:''}</div>
    </div>`;
}
function renderPrjRows(list){
  const vehicles=DB.all('vehicles');
  return list.map((p,i)=>{const cnt=vehicles.filter(v=>v.projectId===p.id).length;
    return`<tr><td>${i+1}</td>
      <td><strong>${esc(p.name)}</strong>${p.description?`<div class="text-muted" style="font-size:11px">${esc(p.description)}</div>`:''}</td>
      <td>${esc(p.location||'-')}</td><td>${esc(p.contractNo||'-')}</td>
      <td><span class="badge ${PRJ_SB[p.status]||'b-secondary'}">${PRJ_ST[p.status]||p.status||'-'}</span></td>
      <td><span class="badge b-info">${cnt}</span></td>
      <td class="tbl-actions">
        ${can('projects_edit')?`<button class="btn btn-sm btn-info" onclick="openProjectModal('${p.id}')">✏️</button>`:''}
        ${can('projects_delete')?`<button class="btn btn-sm btn-danger" onclick="confirmDelProject('${p.id}')">🗑️</button>`:''}
      </td></tr>`;}).join('');
}
function filterProjects(){
  const q=document.getElementById('prjS').value.toLowerCase();
  document.getElementById('prjTb').innerHTML=renderPrjRows(DB.all('projects').filter(p=>p.name.toLowerCase().includes(q)||(p.location||'').toLowerCase().includes(q)));
}
function openProjectModal(id){
  const p=id?DB.find('projects',id):null;
  openModal(id?'تعديل مشروع':'إضافة مشروع جديد',`
    <div class="form-row">
      <div class="form-group"><label>اسم المشروع <span class="req">*</span></label><input class="form-control" id="pm_n" value="${p?esc(p.name):''}"></div>

const V_ST={working:'تعمل',maintenance:'صيانة',stopped:'متوقفة'};

const FUEL_TYPES=['ديزل','بنزين 91','بنزين 95'];
let _showArchivedVeh=false;

          <select class="f-select" id="vPF" onchange="filterVehicles()"><option value="">كل المشاريع</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
          <select class="f-select" id="vSF" onchange="filterVehicles()"><option value="">كل الحالات</option><option value="working">تعمل</option><option value="maintenance">صيانة</option><option value="stopped">متوقفة</option></select>
        </div></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th></th><th>#</th><th>السيارة</th><th>اللوحة</th><th>المجموعة</th><th>المشروع</th><th>الوقود</th><th>الاستمارة</th><th>التأمين</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
        <tbody id="vTb">${renderVehRows(vehicles)}</tbody>

function renderVehRows(list){
  const groups=DB.all('groups'),projects=DB.all('projects');
  return list.map((v,i)=>{
    const g=groups.find(x=>x.id===v.groupId),p=projects.find(x=>x.id===v.projectId);
    const rd=daysUntil(v.registrationExpiry),id2=daysUntil(v.insuranceExpiry);
    const rb=v.registrationExpiry?(rd<=0?'<span class="badge b-danger">منتهية</span>':rd<=30?`<span class="badge b-warning">${rd}ي</span>`:`<span class="badge b-success">${fmtDate(v.registrationExpiry)}</span>`):'<span class="text-muted">-</span>';
    const ib=v.insuranceExpiry?(id2<=0?'<span class="badge b-danger">منتهي</span>':id2<=30?`<span class="badge b-warning">${id2}ي</span>`:`<span class="badge b-success">${fmtDate(v.insuranceExpiry)}</span>`):'<span class="text-muted">-</span>';
    return`<tr>
      <td>${v.photo?`<img src="${v.photo}" class="vehicle-photo" alt="">`:'<span style="font-size:22px">🚛</span>'}</td>
      <td>${i+1}</td>
      <td><strong>${esc(v.name)}</strong>${v.chassisNumber?`<div class="text-muted" style="font-size:11px">هيكل: ${esc(v.chassisNumber)}</div>`:''}</td>
      <td><span class="code-tag">${esc(v.plate||'-')}</span></td>
      <td>${g?esc(g.name):'-'}</td><td>${p?esc(p.name):'-'}</td><td>${esc(v.fuelType||'-')}</td>
      <td>${rb}</td><td>${ib}</td>
      <td><span class="badge ${V_SB[v.status]||'b-secondary'}">${V_ST[v.status]||v.status}</span></td>
      <td class="tbl-actions">
        ${!v.archived&&can('vehicles_edit')?`<button class="btn btn-sm btn-info" onclick="openVehicleModal('${v.id}')">✏️</button>`:''}
        ${!v.archived&&can('fuel_add')?`<button class="btn btn-sm btn-success" onclick="openFuelModal(null,'${v.id}')">⛽</button>`:''}
        ${!v.archived&&can('vehicles_delete')?`<button class="btn btn-sm btn-warning" onclick="archiveVehicle('${v.id}')" title="أرشفة">📦 أرشفة</button>`:''}
        ${v.archived&&can('vehicles_edit')?`<button class="btn btn-sm btn-success" onclick="restoreVehicle('${v.id}')">♻️ استعادة</button>`:''}
        ${v.archived&&isOwner()?`<button class="btn btn-sm btn-danger" onclick="confirmDelVehicle('${v.id}')">🗑️</button>`:''}
      </td></tr>`;}).join('');
}
function filterVehicles(){
  const q=(document.getElementById('vS').value||'').toLowerCase();
  const gf=document.getElementById('vGF').value,pf=document.getElementById('vPF').value,sf=document.getElementById('vSF').value;
  let v=DB.all('vehicles').filter(x=>!!x.archived===_showArchivedVeh);
  if(q)v=v.filter(x=>x.name.toLowerCase().includes(q)||(x.plate||'').toLowerCase().includes(q)||(x.chassisNumber||'').toLowerCase().includes(q));
  if(gf)v=v.filter(x=>x.groupId===gf);if(pf)v=v.filter(x=>x.projectId===pf);if(sf)v=v.filter(x=>x.status===sf);
  document.getElementById('vTb').innerHTML=renderVehRows(v);
}
function openVehicleModal(id){

  openModal(id?'تعديل السيارة':'إضافة سيارة جديدة',`
    <div class="form-section-title">البيانات الأساسية</div>
    <div class="form-row">
      <div class="form-group"><label>اسم السيارة <span class="req">*</span></label><input class="form-control" id="vm_n" value="${v?esc(v.name):''}"></div>
      <div class="form-group"><label>رقم اللوحة</label><input class="form-control" id="vm_p" value="${v?esc(v.plate||''):''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>المجموعة</label>
        <select class="form-control" id="vm_g"><option value="">--</option>${groups.map(g=>`<option value="${g.id}"${v&&v.groupId===g.id?' selected':''}>${esc(g.name)}</option>`).join('')}</select></div>
      <div class="form-group"><label>المشروع</label>
        <select class="form-control" id="vm_pr"><option value="">--</option>${projects.map(p=>`<option value="${p.id}"${v&&v.projectId===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>نوع الوقود</label>

      <div class="form-group"><label>الحالة</label>
        <select class="form-control" id="vm_s">
          <option value="working"${!v||v.status==='working'?' selected':''}>✅ تعمل</option>
          <option value="maintenance"${v&&v.status==='maintenance'?' selected':''}>🔧 صيانة</option>
          <option value="stopped"${v&&v.status==='stopped'?' selected':''}>🔴 متوقفة</option>
        </select></div>
    </div>
    <div class="form-group"><label>مصدر التعبئة المسموح به</label>
      <select class="form-control" id="vm_fs">
        <option value="both"${!v||!v.fuelSource||v.fuelSource==='both'?' selected':''}>🔄 التانكي والمحطات (كلاهما)</option>
        <option value="tank"${v&&v.fuelSource==='tank'?' selected':''}>🛢️ من التانكي فقط</option>
        <option value="station"${v&&v.fuelSource==='station'?' selected':''}>⛽ من المحطات فقط</option>
      </select>
      <div class="form-hint">يحدد مصادر الوقود المسموح بها عند تسجيل التعبئة</div>
    </div>
    <div style="display:none">
    </div>
    <hr class="form-divider">
    <div class="form-section-title">بيانات التسجيل والتأمين</div>
    <div class="form-row">
      <div class="form-group"><label>رقم الهيكل</label><input class="form-control" id="vm_ch" value="${v?esc(v.chassisNumber||''):''}"></div>
      <div class="form-group"><label>رقم الاستمارة</label><input class="form-control" id="vm_rn" value="${v?esc(v.registrationNumber||''):''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>تاريخ انتهاء الاستمارة</label><input class="form-control" type="date" id="vm_re" value="${v?v.registrationExpiry||'':''}"></div>
      <div class="form-group"><label>شركة التأمين</label><input class="form-control" id="vm_ic" value="${v?esc(v.insuranceCompany||''):''}"></div>
    </div>
    <div class="form-group"><label>تاريخ انتهاء التأمين</label><input class="form-control" type="date" id="vm_ie" value="${v?v.insuranceExpiry||'':''}"></div>
    <hr class="form-divider">
    <div class="form-section-title">صورة المركبة (JPG/PNG — حد أقصى 2MB)</div>
    <div class="form-group">
      <div class="upload-area" onclick="document.getElementById('vm_pi').click()">📷 اضغط لاختيار صورة</div>
      <input type="file" id="vm_pi" accept=".jpg,.jpeg,.png" style="display:none" onchange="prevVehPhoto(event)">
      <img id="vm_pp" class="photo-preview${v&&v.photo?' show':''}" src="${v&&v.photo?v.photo:'#'}">
    </div>`,
    'حفظ',()=>saveVehicle(id),{wide:true});

function prevVehPhoto(e){
  const file=e.target.files[0];if(!file)return;
  if(file.size>2*1024*1024){toast('الصورة أكبر من 2MB','error');return;}
  const r=new FileReader();r.onload=ev=>{const img=document.getElementById('vm_pp');img.src=ev.target.result;img.classList.add('show');};r.onerror=()=>toast('فشل قراءة الصورة','error');r.readAsDataURL(file);
}
function saveVehicle(id){
  if(id?!can('vehicles_edit'):!can('vehicles_add')){toast('ليس لديك صلاحية','error');return;}
  const name=document.getElementById('vm_n').value.trim();
  if(!name){toast('أدخل اسم السيارة','error');return;}
  const pp=document.getElementById('vm_pp');
  const data={name,plate:document.getElementById('vm_p').value.trim(),groupId:document.getElementById('vm_g').value||null,projectId:document.getElementById('vm_pr').value||null,
    fuelType:document.getElementById('vm_f').value,status:document.getElementById('vm_s').value,
    fuelSource:document.getElementById('vm_fs').value,
    chassisNumber:document.getElementById('vm_ch').value.trim(),registrationNumber:document.getElementById('vm_rn').value.trim(),
    registrationExpiry:document.getElementById('vm_re').value||null,insuranceCompany:document.getElementById('vm_ic').value.trim(),
    insuranceExpiry:document.getElementById('vm_ie').value||null};
  if(pp.src&&pp.src.startsWith('data:'))data.photo=pp.src;
  else if(id){const ex=DB.find('vehicles',id);if(ex?.photo)data.photo=ex.photo;}
  if(id){DB.update('vehicles',id,data);logAct('تعديل سيارة',name);}else{DB.add('vehicles',data);logAct('إضافة سيارة',name);}
  toast(id?'تم التحديث':'تمت الإضافة');closeModal();renderVehicles();
}
function archiveVehicle(id){
  const v=DB.find('vehicles',id);
  confirm2(`أرشفة "${v?.name}"؟ ستختفي من القوائم النشطة مع الحفاظ على جميع سجلاتها.`,()=>{
    DB.update('vehicles',id,{archived:true,archivedAt:new Date().toISOString()});
    logAct('أرشفة سيارة',v?.name||'');
    toast('تم أرشفة السيارة — يمكن استعادتها من قسم المؤرشفة');
    renderVehicles();
  });
}
function restoreVehicle(id){
  const v=DB.find('vehicles',id);
  DB.update('vehicles',id,{archived:false,archivedAt:null});
  logAct('استعادة سيارة',v?.name||'');
  toast('تمت استعادة السيارة');
  renderVehicles(true);
}
function confirmDelVehicle(id){
  const v=DB.find('vehicles',id);
  confirm2(`⚠️ حذف نهائي لـ "${v?.name}"؟ لا يمكن التراجع — ستُحذف جميع السجلات المرتبطة.`,()=>{
    DB.del('vehicles',id);
    DB.set('fuel',DB.all('fuel').filter(r=>r.vehicleId!==id));
    DB.set('maintenance',DB.all('maintenance').filter(r=>r.vehicleId!==id));
    DB.set('notes',DB.all('notes').filter(r=>r.vehicleId!==id));
    DB.set('attachments',DB.all('attachments').filter(r=>!(r.entityType==='vehicle'&&r.entityId===id)));
    // Remove from drivers
    const drivers=DB.all('drivers');
    drivers.forEach(d=>{if(d.vehicleIds?.includes(id)){DB.update('drivers',d.id,{vehicleIds:d.vehicleIds.filter(x=>x!==id)});}});
    logAct('حذف سيارة نهائي',v?.name||'');toast('تم الحذف النهائي للسيارة');renderVehicles(true);
  });
}

function renderTanks(){
  if(!can('tanks_view')){toast('ليس لديك صلاحية','error');navigate('dashboard');return;}

  const tanks=DB.all('tanks');
  const fills=DB.all('tankFills').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,20);
  document.getElementById('pageBody').innerHTML=`
    <div class="tanks-grid">${renderTankCards(tanks)}</div>
    <div class="card">
      <div class="card-header"><span class="card-title">🛢️ التانكيات (${tanks.length})</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>الاسم</th><th>نوع الوقود</th><th>السعة</th><th>الكمية الحالية</th><th>المتبقي للامتلاء</th><th>النسبة</th><th>الإجراءات</th></tr></thead>
        <tbody>${tanks.length===0?`<tr><td colspan="8" class="tbl-empty"><div class="ei">🛢️</div><p>لا توجد تانكيات</p></td></tr>`:
          tanks.map((tk,i)=>{const pct=tk.capacity>0?Math.min(100,Math.round(tk.currentLevel/tk.capacity*100)):0;const bc=pct>50?'b-success':pct>20?'b-warning':'b-danger';
            return`<tr><td>${i+1}</td><td><strong>${esc(tk.name)}</strong></td><td>${esc(tk.fuelType)}</td>
              <td>${fmtNum(tk.capacity)} لتر</td><td><strong>${fmtNum(tk.currentLevel)}</strong> لتر</td>
              <td>${fmtNum(tk.capacity-tk.currentLevel)} لتر</td><td><span class="badge ${bc}">${pct}%</span></td>
              <td class="tbl-actions">
                ${can('tanks_edit')?`<button class="btn btn-sm btn-success" onclick="openTankFillModal('${tk.id}')">➕ تعبئة</button>`:''}
                ${can('tanks_edit')?`<button class="btn btn-sm btn-info" onclick="openTankModal('${tk.id}')">✏️</button>`:''}
                ${can('tanks_delete')?`<button class="btn btn-sm btn-danger" onclick="confirmDelTank('${tk.id}')">🗑️</button>`:''}
              </td></tr>`;}).join('')}
        </tbody>
      </table></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">📋 سجل تعبئات التانكيات (آخر 20)</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>التانكي</th><th>الكمية المضافة</th><th>التاريخ</th><th>السعر/لتر</th><th>التكلفة</th><th>ملاحظات</th></tr></thead>
        <tbody>${fills.length===0?`<tr><td colspan="7" class="tbl-empty"><p>لا توجد سجلات</p></td></tr>`:
          fills.map((f,i)=>{const tk=DB.find('tanks',f.tankId);return`<tr><td>${i+1}</td><td>${tk?esc(tk.name):'-'}</td><td><strong>${fmtNum(f.liters)}</strong> لتر</td><td>${fmtDate(f.date||f.createdAt)}</td><td>${f.pricePerLiter?fmtNum(f.pricePerLiter)+' ر.س':'-'}</td><td>${f.totalCost?fmtNum(f.totalCost)+' ر.س':'-'}</td><td>${esc(f.notes||'-')}</td></tr>`;}).join('')}
        </tbody>
      </table></div>
    </div>`;
}
function renderTankCards(tanks){
  return tanks.map(tk=>{const pct=tk.capacity>0?Math.min(100,Math.round(tk.currentLevel/tk.capacity*100)):0;const cls=pct>50?'tf-green':pct>20?'tf-yellow':'tf-red';
    return`<div class="tank-card"><div class="tank-name">${esc(tk.name)}</div><div class="tank-type">${esc(tk.fuelType)}</div>
      <div class="tank-nums"><span>الحالي: <strong>${fmtNum(tk.currentLevel)} لتر</strong></span><span>السعة: ${fmtNum(tk.capacity)}</span></div>
      <div class="tank-bar"><div class="tank-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="tank-pct" style="color:${pct>50?'var(--success)':pct>20?'var(--warning)':'var(--danger)'}">${pct}% ممتلئ — متبقٍ للامتلاء: ${fmtNum(tk.capacity-tk.currentLevel)} لتر</div>
    </div>`;}).join('');
}
function openTankModal(id){

    <div class="form-row">
      <div class="form-group"><label>الاسم <span class="req">*</span></label><input class="form-control" id="tkn" value="${tk?esc(tk.name):''}"></div>
      <div class="form-group"><label>نوع الوقود</label>
        <select class="form-control" id="tkf">${FUEL_TYPES.map(f=>`<option${tk&&tk.fuelType===f?' selected':''}>${f}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>السعة الكاملة (لتر)</label><input class="form-control" type="number" id="tkc" value="${tk?tk.capacity:''}" min="0"></div>
      <div class="form-group"><label>الكمية الحالية (لتر)</label><input class="form-control" type="number" id="tkcur" value="${tk?tk.currentLevel:0}" min="0"></div>
    </div>
    <div class="form-group"><label>حد التنبيه (%)</label><input class="form-control" type="number" id="tka" value="${tk?tk.alertPct||20:20}" min="0" max="100"></div>`,

function saveTank(id){
  if(id?!can('tanks_edit'):!can('tanks_add')){toast('ليس لديك صلاحية','error');return;}
  const name=document.getElementById('tkn').value.trim();if(!name){toast('أدخل الاسم','error');return;}
  const cap=parseFloat(document.getElementById('tkc').value)||0,cur=parseFloat(document.getElementById('tkcur').value)||0;
  if(cur>cap){toast('الكمية الحالية لا تتجاوز السعة','error');return;}
  const data={name,fuelType:document.getElementById('tkf').value,capacity:cap,currentLevel:cur,alertPct:parseInt(document.getElementById('tka').value,10)||20};
  if(id)DB.update('tanks',id,data);else DB.add('tanks',data);
  toast(id?'تم التحديث':'تمت الإضافة');closeModal();renderTanks();
}
function openTankFillModal(tankId){
  const tk=DB.find('tanks',tankId);if(!tk)return;
  const pct=tk.capacity>0?Math.min(100,Math.round(tk.currentLevel/tk.capacity*100)):0;
  const cls=pct>50?'tf-green':pct>20?'tf-yellow':'tf-red';
  openModal(`تعبئة تانكي: ${esc(tk.name)}`,`
    <div style="background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:14px">
      <div style="font-size:13px">الكمية الحالية: <strong>${fmtNum(tk.currentLevel)}</strong> من <strong>${fmtNum(tk.capacity)} لتر</strong></div>
      <div class="tank-bar mt-1"><div class="tank-fill ${cls}" style="width:${pct}%"></div></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>الكمية المضافة (لتر) <span class="req">*</span></label>
        <input class="form-control" type="number" id="tfl" min="0.01" step="0.01" oninput="chkTankFill(${tk.capacity},${tk.currentLevel});calcTankCost()">
        <div class="form-hint" id="tfcost"></div></div>
      <div class="form-group"><label>التاريخ</label><input class="form-control" type="date" id="tfd" value="${today()}"></div>
    </div>
    <div class="form-group"><label>سعر الليتر (ر.س)</label>
      <input class="form-control" type="number" id="tfp" min="0" step="0.01" placeholder="مثال: 0.75" oninput="calcTankCost()">
      <div class="form-hint">اتركه فارغاً لاستخدام سعر النظام</div></div>
    <div id="tfw" style="display:none;color:var(--danger);font-size:13px;margin-bottom:8px"></div>
    <div class="form-group"><label>ملاحظات</label><textarea class="form-control" id="tfn"></textarea></div>`,
    'تأكيد',()=>saveTankFill(tankId));
}
function chkTankFill(cap,cur){
  const l=parseFloat(document.getElementById('tfl').value)||0,w=document.getElementById('tfw');
  if(cur+l>cap){w.style.display='block';w.textContent=`⚠️ ستتجاوز السعة (${fmtNum(cap)} لتر)`;} else w.style.display='none';
}
function calcTankCost(){
  const l=parseFloat(document.getElementById('tfl')?.value)||0;
  const p=parseFloat(document.getElementById('tfp')?.value)||0;
  const el=document.getElementById('tfcost');
  if(el&&l>0&&p>0)el.textContent=`التكلفة الإجمالية: ${fmtNum((l*p).toFixed(2))} ر.س`;
  else if(el)el.textContent='';
}
function saveTankFill(tankId){
  if(!can('tanks_edit')&&!isOwner()){toast('ليس لديك صلاحية','error');return;}
  const liters=parseFloat(document.getElementById('tfl').value)||0;
  if(liters<=0){toast('أدخل كمية صحيحة','error');return;}
  if(!document.getElementById('tfd').value){toast('أدخل التاريخ','error');return;}
  const tk=DB.find('tanks',tankId);
  if(liters>tk.capacity-tk.currentLevel){toast(`الكمية (${liters}L) تتجاوز السعة المتبقية (${fmtNum(tk.capacity-tk.currentLevel)}L)`,'error');return;}
  const balanceBefore=tk.currentLevel;
  const newLevel=Math.min(tk.capacity,tk.currentLevel+liters);
  DB.update('tanks',tankId,{currentLevel:newLevel});
  const fill=DB.add('tankFills',{tankId,liters,date:document.getElementById('tfd').value,notes:document.getElementById('tfn').value.trim(),
    pricePerLiter:parseFloat(document.getElementById('tfp').value)||null,
    totalCost:parseFloat(document.getElementById('tfp').value)&&parseFloat(document.getElementById('tfl').value)
      ?(parseFloat(document.getElementById('tfl').value)*parseFloat(document.getElementById('tfp').value)).toFixed(2)
      :null,
    userId:currentUser.id,userName:currentUser.name});
  logFuelMovement(tankId,'fill',liters,balanceBefore,newLevel,'tank_fill',fill.id);
  logAct('تعبئة تانكي',`${tk.name} +${liters}L → ${fmtNum(newLevel)}L`);
  toast(`✅ رصيد التانكي الجديد: ${fmtNum(newLevel)} لتر`);closeModal();renderTanks();
}
function confirmDelTank(id){
  const tk=DB.find('tanks',id);
  confirm2(`حذف تانكي "${tk?.name}"؟`,()=>{DB.del('tanks',id);toast('تم الحذف');renderTanks();});
}

function onFuelVehCh(){
  const v=DB.find('vehicles',document.getElementById('fm_v').value);
  const tanks=DB.all('tanks');
  const fuelSrc=v?.fuelSource||'both';
  const mt=v?tanks.filter(tk=>tk.fuelType===v.fuelType):tanks;
  const sel=document.getElementById('fm_tk');
  let opts='';
  if(fuelSrc!=='tank')opts+=`<option value="">⛽ من المحطة (خارجي)</option>`;
  if(fuelSrc!=='station')opts+=mt.map(tk=>`<option value="${tk.id}">🛢️ ${esc(tk.name)} — ${fmtNum(tk.currentLevel)} لتر</option>`).join('');
  sel.innerHTML=opts;
  const badge=document.getElementById('fm_src_badge');
  if(badge){
    const srcColors={tank:'#eafaf1',station:'#fef3e7',both:'#ebf5fb'};
    const srcLabels={tank:'🛢️ هذه المركبة تُعبَّأ من التانكي فقط',station:'⛽ من المحطات الخارجية فقط',both:'🔄 مسموح: التانكي أو المحطة'};
    badge.style.background=srcColors[fuelSrc]||'#ebf5fb';
    badge.textContent=v?srcLabels[fuelSrc]||'':'';
    badge.style.display=v?'block':'none';
  }
  if(v){
    const lastOdo=DB.all('fuel').filter(f=>f.vehicleId===v.id&&f.odometer).sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt))[0]?.odometer;
    const hint=document.querySelector('#fm_odo+.form-hint');
    if(hint)hint.textContent=lastOdo?`آخر قراءة: ${fmtNum(lastOdo)} كم`:'لا توجد قراءة سابقة';
  }
  calcFuelCost();
}
function onFuelTkCh(){
  const tkId=document.getElementById('fm_tk').value,info=document.getElementById('fm_tki');
  if(!tkId){info.style.display='none';return;}
  const tk=DB.find('tanks',tkId);if(!tk){info.style.display='none';return;}
  const pct=tk.capacity>0?Math.round((tk.currentLevel/tk.capacity)*100):0;
  const cls=pct>50?'tf-green':pct>20?'tf-yellow':'tf-red';
  info.style.display='block';
  info.innerHTML=`🛢️ <strong>${esc(tk.name)}</strong> — الرصيد: <strong style="color:${pct>20?'var(--success)':'var(--danger)'}">${fmtNum(tk.currentLevel)} لتر</strong> (${pct}%)`;
}
function calcFuelCost(){
  const v=DB.find('vehicles',document.getElementById('fm_v')?.value);
  const qty=parseFloat(document.getElementById('fm_q')?.value)||0;
  const costEl=document.getElementById('fm_c'),hint=document.getElementById('fm_ph');
  if(!v||qty<=0){if(costEl)costEl.value='';if(hint)hint.textContent='';return;}
  const price=fuelPrice(v.fuelType);const cost=(qty*price).toFixed(2);
  if(costEl)costEl.value=cost;
  if(hint)hint.textContent=`سعر اللتر الحالي: ${price} ر.س × ${qty} لتر = ${cost} ر.س`;
}
function saveFuelRec(id){
  const vehicleId=document.getElementById('fm_v').value;
  const date=document.getElementById('fm_d').value;
  const qty=parseFloat(document.getElementById('fm_q').value)||0;
  const cost=parseFloat(document.getElementById('fm_c').value)||0;
  const tankId=document.getElementById('fm_tk').value;
  if(!vehicleId){toast('اختر السيارة','error');return;}
  if(!date){toast('اختر التاريخ','error');return;}
  if(qty<=0){toast('أدخل كمية صحيحة','error');return;}
  if(tankId){
    const tk=DB.find('tanks',tankId);
    if(tk&&qty>tk.currentLevel){toast(`الكمية (${qty}L) أكبر من رصيد التانكي (${fmtNum(tk.currentLevel)}L)`,'error');return;}
  }
  // Historical price: keep original when editing, save current when adding
  const existingRec=id?DB.find('fuel',id):null;
  const v=DB.find('vehicles',vehicleId);
  const pricePerLiter=existingRec?.pricePerLiter||fuelPrice(v?.fuelType||'ديزل');
  // Odometer + distance
  const _odoRaw=document.getElementById('fm_odo').value.trim();
  const odometer=_odoRaw===''?null:parseInt(_odoRaw,10)||null;
  let distance=null,prevOdometer=null;
  if(odometer&&!id){
    const lastRec=DB.all('fuel').filter(f=>f.vehicleId===vehicleId&&f.odometer).sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt))[0];
    if(lastRec?.odometer){prevOdometer=lastRec.odometer;distance=odometer-prevOdometer;}
  } else if(id&&existingRec){prevOdometer=existingRec.prevOdometer;distance=existingRec.distance;}
  const data={vehicleId,date,quantity:qty,cost,pricePerLiter,tankId:tankId||null,
    projectId:document.getElementById('fm_pr').value||null,
    fillTime:document.getElementById('fm_t').value||null,
    odometer,prevOdometer,distance,
    approvalStatus:'pending',
    ...(id&&existingRec?.approvedBy?{approvedBy:null,approvedByName:null,approvedAt:null}:{}),
    notes:document.getElementById('fm_n').value.trim(),userId:currentUser.id,userName:currentUser.name};
  if(id){
    // Restore old tank balance + log
    const old=DB.find('fuel',id);
    if(old?.tankId){
      const otk=DB.find('tanks',old.tankId);
      if(otk){const restored=Math.min(otk.capacity,otk.currentLevel+old.quantity);
        logFuelMovement(old.tankId,'fill',old.quantity,otk.currentLevel,restored,'edit_restore',id);
        DB.update('tanks',old.tankId,{currentLevel:restored});}
    }
    DB.update('fuel',id,data);
    // Re-deduct from new tank
    if(tankId){const tk=DB.find('tanks',tankId);if(tk){const b=tk.currentLevel,a=Math.max(0,tk.currentLevel-qty);DB.update('tanks',tankId,{currentLevel:a});logFuelMovement(tankId,'consume',qty,b,a,'vehicle_fuel_edit',id);}}
    logAct('تعديل تعبئة',`${v?.name||''} ${qty}L`);
    toast('تم التحديث');
  } else {
    const newRec=DB.add('fuel',data);
    // Deduct from tank + log movement
    if(tankId){const tk=DB.find('tanks',tankId);if(tk){const b=tk.currentLevel,a=Math.max(0,tk.currentLevel-qty);DB.update('tanks',tankId,{currentLevel:a});logFuelMovement(tankId,'consume',qty,b,a,'vehicle_fuel',newRec.id);}}
    logAct('إضافة تعبئة',`${v?.name||''} ${qty}L`);
    toast('تمت إضافة التعبئة');
  }
  _fuelVPreset='';closeModal();renderFuel();
}

        <div class="filter-bar">
          <select class="f-select" id="fvf" onchange="filterFuel()"><option value="">كل السيارات</option>${vehicles.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select>
          <select class="f-select" id="fpf" onchange="filterFuel()"><option value="">كل المشاريع</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
          <input class="f-input" type="date" id="fdf" onchange="filterFuel()">
          <input class="f-input" type="date" id="ftf" onchange="filterFuel()">
        </div></div>
      <div id="fuelSum" style="display:flex;gap:24px;padding:9px 18px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap">
        <span>⛽ الكمية: <strong>${fmtNum(tQ)} لتر</strong></span>
        <span>💰 التكلفة: <strong>${fmtNum(tC)} ر.س</strong></span>
        <span>📋 العمليات: <strong>${fuelData.length}</strong></span>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>التاريخ</th><th>السيارة</th><th>المشروع</th><th>المصدر</th><th>الكمية</th><th>سعر/لتر</th><th>التكلفة</th><th>العداد</th><th>المسافة</th><th>الإجراءات</th></tr></thead>
        <tbody id="fuelTb">${renderFuelRows(fuelData)}</tbody>
      </table></div>
    </div>`;
  if(_sf.vf)document.getElementById('fvf').value=_sf.vf;
  if(_sf.pf)document.getElementById('fpf').value=_sf.pf;
  if(_sf.df)document.getElementById('fdf').value=_sf.df;
  if(_sf.tf)document.getElementById('ftf').value=_sf.tf;
  if(Object.values(_sf).some(Boolean))filterFuel();
}
function renderFuelRows(rows){
  if(!rows.length)return`<tr><td colspan="11" class="tbl-empty"><div class="ei">⛽</div><p>لا توجد سجلات</p></td></tr>`;
  return rows.map((r,i)=>{
    const v=DB.find('vehicles',r.vehicleId),p=DB.find('projects',r.projectId),tk=r.tankId?DB.find('tanks',r.tankId):null;
    const odoCell=r.odometer?`<span style="font-size:12px;font-weight:600">${fmtNum(r.odometer)}<br><span class="text-muted">كم</span></span>`:'<span class="text-muted">-</span>';
    const distCell=r.distance!=null?(r.distance>=0?`<span class="text-success" style="font-weight:700;font-size:12px">+${fmtNum(r.distance)} كم</span>`:`<span class="text-danger" style="font-size:12px">${fmtNum(r.distance)} كم</span>`):'<span class="text-muted">-</span>';
    const aprvMap={approved:'<span class="badge b-success" style="font-size:11px">✅ معتمدة</span>',rejected:'<span class="badge b-danger" style="font-size:11px">❌ مرفوضة</span>',pending:'<span class="badge b-warning" style="font-size:11px">⏳ انتظار</span>'};
