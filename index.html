function filterFuel(){
  const vf=document.getElementById('fvf').value,pf=document.getElementById('fpf').value;
  const df=document.getElementById('fdf').value,tf=document.getElementById('ftf').value;
  let rows=DB.all('fuel').sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));
  if(vf)rows=rows.filter(r=>r.vehicleId===vf);if(pf)rows=rows.filter(r=>r.projectId===pf);
  if(df)rows=rows.filter(r=>(r.date||r.createdAt.slice(0,10))>=df);
  if(tf)rows=rows.filter(r=>(r.date||r.createdAt.slice(0,10))<=tf);
  document.getElementById('fuelTb').innerHTML=renderFuelRows(rows);
  document.querySelector('.card-title').textContent=`سجل المحروقات (${rows.length})`;
  const tQ=rows.reduce((s,r)=>s+(parseFloat(r.quantity)||0),0),tC=rows.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
  document.getElementById('fuelSum').innerHTML=`<span>⛽ الكمية: <strong>${fmtNum(tQ)} لتر</strong></span><span>💰 التكلفة: <strong>${fmtNum(tC)} ر.س</strong></span><span>📋 العمليات: <strong>${rows.length}</strong></span>`;
}
function confirmDelFuel(id){
  confirm2('حذف هذا السجل؟',()=>{
    const r=DB.find('fuel',id);
    if(r?.tankId){
      const tk=DB.find('tanks',r.tankId);
      if(tk){
        const restored=Math.min(tk.capacity,tk.currentLevel+r.quantity);
        logFuelMovement(r.tankId,'fill',r.quantity,tk.currentLevel,restored,'delete_restore',id);
        DB.update('tanks',r.tankId,{currentLevel:restored});
      }
    }
    DB.del('fuel',id);logAct('حذف تعبئة',DB.find('vehicles',r?.vehicleId)?.name||'');toast('تم الحذف');renderFuel();
  });
}

function renderFuelApproval(){

  const pending=DB.all('fuel').filter(r=>!r.approvalStatus||r.approvalStatus==='pending').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!pending.length){toast('لا توجد تعبئات بانتظار الاعتماد','info');return;}
  openModal(`اعتماد التعبئات — ${pending.length} بانتظار`,`
    <div style="max-height:400px;overflow-y:auto">
      ${pending.map(r=>{
        const v=DB.find('vehicles',r.vehicleId),p=DB.find('projects',r.projectId);
        return`<div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <div>
              <strong>${v?esc(v.name):'مركبة محذوفة'}</strong>
              <span class="text-muted" style="font-size:12px"> — ${fmtDate(r.date||r.createdAt)}${r.fillTime?` — 🕐 ${r.fillTime}`:''}</span><br>
              <span style="font-size:13px">${fmtNum(r.quantity)} لتر — <strong>${fmtNum(r.cost)} ر.س</strong>${p?' — '+esc(p.name):''}</span>
              ${r.odometer?`<br><span class="text-muted" style="font-size:12px">عداد: ${fmtNum(r.odometer)} كم${r.distance!=null?` (${r.distance>=0?'+':''}${fmtNum(r.distance)} كم)`:''}</span>`:''}
              <br><span class="text-muted" style="font-size:11px">بواسطة: ${esc(r.userName||'-')}</span>
            </div>
            <div class="tbl-actions">
              <button class="btn btn-sm btn-success" onclick="approveFuel('${r.id}')">✅ اعتماد</button>
              <button class="btn btn-sm btn-danger" onclick="rejectFuel('${r.id}')">❌ رفض</button>
            </div>
          </div>
        </div>`;}).join('')}
    </div>`,null,null);
}

function approveFuel(id){
  DB.update('fuel',id,{approvalStatus:'approved',approvedBy:currentUser.id,approvedByName:currentUser.name,approvedAt:new Date().toISOString()});
  const r=DB.find('fuel',id);const v=DB.find('vehicles',r?.vehicleId);
  logAct('اعتماد تعبئة',v?.name||'');
  toast(`✅ تم اعتماد تعبئة: ${esc(v?.name||'')}`,`success`);
  closeModal();
  const _rem=DB.all('fuel').filter(r=>!r.approvalStatus||r.approvalStatus==='pending');
  if(_rem.length)renderFuelApproval();else{toast('تم اعتماد جميع التعبئات','info');renderFuel();}
}

function rejectFuel(id){
  const reason=prompt('سبب الرفض (اختياري):');
  const r=DB.find('fuel',id);
  if(r?.tankId){
    const tk=DB.find('tanks',r.tankId);
    if(tk){const restored=Math.min(tk.capacity,tk.currentLevel+(parseFloat(r.quantity)||0));
      DB.update('tanks',r.tankId,{currentLevel:restored});
      logFuelMovement(r.tankId,'fill',r.quantity,tk.currentLevel,restored,'reject_restore',id);}
  }
  DB.update('fuel',id,{approvalStatus:'rejected',rejectedBy:currentUser.id,rejectedByName:currentUser.name,rejectedAt:new Date().toISOString(),rejectionReason:reason||''});
  const v=DB.find('vehicles',r?.vehicleId);
  logAct('رفض تعبئة',v?.name||'');
  toast(`❌ تم رفض تعبئة: ${esc(v?.name||'')}`,`warning`);
  closeModal();
  const _rem=DB.all('fuel').filter(r=>!r.approvalStatus||r.approvalStatus==='pending');
  if(_rem.length)renderFuelApproval();else{toast('تم اعتماد جميع التعبئات','info');renderFuel();}
}

function saveInvoice(id){
  if(id?!can('invoices_edit'):!can('invoices_add')){toast('ليس لديك صلاحية','error');return;}
  const data={invoiceNo:document.getElementById('ivm_n').value.trim(),date:document.getElementById('ivm_d').value,
    amount:parseFloat(document.getElementById('ivm_a').value)||0,vehicleId:document.getElementById('ivm_v').value||null,

    notes:document.getElementById('ivm_notes').value.trim(),userId:currentUser.id,userName:currentUser.name};
  let savedId=id;

  else{const rec=DB.add('invoices',data);savedId=rec.id;logAct('رفع فاتورة',data.invoiceNo||'');}

function showReport(type){
  const area=document.getElementById('reportArea');
  if(!area && !_captureReport)return;
  // Reports: approved records only (legacy records without status are included)
  const fuel=DB.all('fuel').filter(r=>r.approvalStatus==='approved'||!r.approvalStatus),maint=DB.all('maintenance'),vehicles=DB.all('vehicles'),projects=DB.all('projects'),users=DB.all('users');

  if(type==='fuelVeh'){
    const byVeh={};
    fuel.forEach(r=>{
      const k=r.vehicleId||'_none_';
      if(!byVeh[k])byVeh[k]={liters:0,cost:0,count:0};
      byVeh[k].liters+=(parseFloat(r.quantity)||0);
      byVeh[k].cost+=(parseFloat(r.cost)||0);
      byVeh[k].count++;
    });
    const rows=Object.entries(byVeh).sort((a,b)=>b[1].cost-a[1].cost).map(([vid,d])=>{
      const v=DB.find('vehicles',vid);const g=v?DB.find('groups',v.groupId):null;const p=v?DB.find('projects',v.projectId):null;
      return[v?v.name:'غير محدد',g?g.name:'-',p?p.name:'-',v?v.fuelType:'-',fmtNum(d.liters)+' لتر',fmtNum(d.cost)+' ر.س',d.count];
    });
    const tL=fuel.reduce((s,r)=>s+(parseFloat(r.quantity)||0),0),tC=fuel.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
    const hdrs=['السيارة','المجموعة','المشروع','الوقود','الكمية','التكلفة','العمليات'];
    {const _rh=buildReportCard('⛽ تقرير الوقود بالسيارة',hdrs,rows,
      [{label:'إجمالي الكمية',val:fmtNum(tL)+' لتر'},{label:'إجمالي التكلفة',val:fmtNum(tC)+' ر.س'}],
      type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='fuelPrj'){
    const byPrj={};
    fuel.forEach(r=>{const k=r.projectId||'_none_';if(!byPrj[k])byPrj[k]={liters:0,cost:0,vids:new Set()};byPrj[k].liters+=(parseFloat(r.quantity)||0);byPrj[k].cost+=(parseFloat(r.cost)||0);byPrj[k].vids.add(r.vehicleId);});
    const rows=Object.entries(byPrj).sort((a,b)=>b[1].cost-a[1].cost).map(([pid,d])=>{
      const p=DB.find('projects',pid);
      return[p?p.name:'بدون مشروع',fmtNum(d.liters)+' لتر',fmtNum(d.cost)+' ر.س',d.vids.size];
    });
    const hdrs=['المشروع','الكمية','التكلفة','عدد السيارات'];
    {const _rh=buildReportCard('🏗️ تقرير الوقود بالمشروع',hdrs,rows,[],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='maintRep'){
    const rows=maint.sort((a,b)=>new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt)).map(m=>{
      const v=DB.find('vehicles',m.vehicleId),p=DB.find('projects',m.projectId);
      return[v?v.name:'-',m.type||'-',p?p.name:'-',fmtDate(m.date||m.createdAt),fmtNum(m.cost)+' ر.س',m.workshop||'-'];
    });
    const tC=maint.reduce((s,m)=>s+(parseFloat(m.cost)||0),0);
    const hdrs=['السيارة','النوع','المشروع','التاريخ','التكلفة','الورشة'];
    {const _rh=buildReportCard('🔧 تقرير الصيانة',hdrs,rows,[{label:'إجمالي التكاليف',val:fmtNum(tC)+' ر.س'}],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='monthly'){
    const months={};
    fuel.forEach(r=>{const m=(r.date||r.createdAt).slice(0,7);if(!months[m])months[m]={fuel:0,maint:0};months[m].fuel+=(parseFloat(r.cost)||0);});
    maint.forEach(r=>{const m=(r.date||r.createdAt).slice(0,7);if(!months[m])months[m]={fuel:0,maint:0};months[m].maint+=(parseFloat(r.cost)||0);});
    const rows=Object.entries(months).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,d])=>{
      const total=d.fuel+d.maint;
      const dt=new Date(m+'-01');const label=dt.toLocaleDateString('ar-SA',{year:'numeric',month:'long'});
      return[label,fmtNum(d.fuel)+' ر.س',fmtNum(d.maint)+' ر.س',fmtNum(total)+' ر.س'];
    });
    const tF=fuel.reduce((s,r)=>s+(parseFloat(r.cost)||0),0),tM=maint.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
    const hdrs=['الشهر','تكلفة الوقود','تكلفة الصيانة','الإجمالي'];
    {const _rh=buildReportCard('📅 تقرير المصروفات الشهرية',hdrs,rows,
      [{label:'وقود',val:fmtNum(tF)+' ر.س'},{label:'صيانة',val:fmtNum(tM)+' ر.س'},{label:'الإجمالي',val:fmtNum(tF+tM)+' ر.س'}],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
  else if(type==='usersRep'){
    const rows=users.map((u,i)=>{
      const uFuel=fuel.filter(f=>f.userId===u.id).length;
      const uMaint=maint.filter(m=>m.userId===u.id).length;

      return[i+1,u.name,u.username,roleMap[u.role]||u.role,uFuel,uMaint];
    });
    const hdrs=['#','الاسم','المستخدم','الصلاحية','عمليات وقود','عمليات صيانة'];
    {const _rh=buildReportCard('👥 تقرير المستخدمين',hdrs,rows,[],type,hdrs,rows);if(area)area.innerHTML=_rh;}
  }
}

let _lastReport={type:'',hdrs:[],rows:[]};
function doExportCSV(type){
  _captureReport=true;
  showReport(type);_captureReport=false;
  if(!_lastReport.rows.length){toast('لا توجد بيانات للتصدير','error');return;}
  const ws=XLSX.utils.aoa_to_sheet([_lastReport.hdrs,..._lastReport.rows]);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'تقرير');
  XLSX.writeFile(wb,`report_${type}_${today()}.xlsx`);
  logAct('تصدير Excel',type);toast('تم تصدير الملف');
}
let _captureReport=false;

function doPrint(type){
  _captureReport=true;showReport(type);_captureReport=false;
  if(!_lastReport.hdrs.length)return;

  w.document.close();logAct('تصدير PDF',type);
}

function buildReportCard(title,hdrs,rows,summaries,type,exportHdrs,exportRows){
  if(_captureReport){_lastReport={type,hdrs:exportHdrs||hdrs,rows:exportRows||rows};return'';}
  const canExcelExp=can('reports_export_excel');const canPrintExp=can('reports_export_pdf');
  const sumHtml=summaries.length?`<div style="display:flex;gap:20px;padding:10px 16px;background:#f8fafc;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap">
    ${summaries.map(s=>`<span>${s.label}: <strong>${s.val}</strong></span>`).join('')}
  </div>`:'';
  return`<div class="card">
    <div class="card-header"><span class="card-title">${title}</span>
      <div class="d-flex gap-2">
        ${canExcelExp?`<button class="btn btn-sm btn-success" onclick="doExportCSV('${type}')">📥 Excel</button>`:''}
        ${canPrintExp?`<button class="btn btn-sm btn-info" onclick="doPrint('${type}')">🖨️ طباعة</button>`:''}
      </div></div>
    ${sumHtml}
    <div class="tbl-wrap"><table>
      <thead><tr>${hdrs.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.length===0?`<tr><td colspan="${hdrs.length}" class="tbl-empty"><p>لا توجد بيانات</p></td></tr>`:
        rows.map(r=>`<tr>${r.map(c=>`<td>${esc(String(c))}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
}

async function saveUser(id){
  const name=document.getElementById('um_n').value.trim();
  const username=document.getElementById('um_u').value.trim();
  const password=document.getElementById('um_p').value;
  if(password&&password.length<6){toast('كلمة المرور 6 أحرف على الأقل','error');return;}
  const role=document.getElementById('um_r').value;
  if(!name){toast('أدخل الاسم','error');return;}
  if(!username){toast('أدخل اسم المستخدم','error');return;}
  if(!id&&!password){toast('أدخل كلمة المرور','error');return;}
  const dup=DB.all('users').find(u=>u.username.toLowerCase()===username.toLowerCase()&&u.id!==id);
  if(dup){toast('اسم المستخدم مستخدم بالفعل','error');return;}
  const u=id?DB.find('users',id):null;
  const isOwnerUser=u?.role==='owner';
  const data={name,username,role:isOwnerUser?'owner':role};
  if(password){
    try{data.password=await hashPwd(password);}
    catch{toast('خطأ في تشفير كلمة المرور — تأكد من استخدام HTTPS','error');return;}
  }
  if(!isOwnerUser)data.permissions=collectPerms();
  if(id){
    DB.update('users',id,data);
    logAct('تعديل مستخدم',name+(data.permissions?'+ تعديل صلاحيات':''));
    // Refresh session if editing self
    if(id===currentUser.id){currentUser={...currentUser,...data};sessionStorage.setItem('fm2_sess',JSON.stringify({id:currentUser.id}));}
    toast('تم التحديث');
  } else {
    DB.add('users',data);
    logAct('إضافة مستخدم',name);
    toast('تمت إضافة المستخدم');
  }
  closeModal();renderUsers();
}

function confirmDelUser(id){
  const u=DB.find('users',id);
  if(u?.role==='owner'){toast('لا يمكن حذف المالك الرئيسي','error');return;}
  if(id===currentUser.id){toast('لا يمكن حذف حسابك الحالي','error');return;}
  confirm2(`حذف المستخدم "${u?.name}"؟`,()=>{
    DB.del('users',id);
    DB.set('fuel',DB.all('fuel').map(r=>r.userId===id?{...r,userId:null,userName:'محذوف'}:r));
    DB.set('maintenance',DB.all('maintenance').map(r=>r.userId===id?{...r,userId:null,userName:'محذوف'}:r));
    logAct('حذف مستخدم',u?.name||'');toast('تم الحذف');renderUsers();
  });
}

/* ============================================================
   ACTIVITY LOG
   ============================================================ */
function renderActivity(){
  if(!can('activity_view')&&!isOwner()){toast('ليس لديك صلاحية','error');navigate('dashboard');return;}
  const logs=DB.all('activity').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const users=[...new Set(logs.map(l=>l.userName).filter(Boolean))];
  document.getElementById('topActions').innerHTML=
    `<button class="btn btn-sm btn-danger" onclick="confirmClearActivity()">🗑️ مسح السجل</button>`;
  document.getElementById('pageBody').innerHTML=`
    <div class="card">
      <div class="card-header"><span class="card-title">سجل النشاط (${logs.length} عملية)</span>
        <div class="filter-bar">
          <select class="f-select" id="alf" onchange="filterActivity()"><option value="">كل المستخدمين</option>${users.map(u=>`<option value="${u}">${esc(u)}</option>`).join('')}</select>
          <input class="f-input" type="search" id="als" placeholder="🔍 بحث بالعملية..." oninput="filterActivity()" onsearch="filterActivity()">
          <input class="f-input" type="date" id="ald" onchange="filterActivity()">
        </div></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th><th>التاريخ والوقت</th></tr></thead>
        <tbody id="actTb">${renderActRows(logs)}</tbody>
      </table></div>
    </div>`;
}
function renderActRows(list){
  if(!list.length)return`<tr><td colspan="5" class="tbl-empty"><div class="ei">📋</div><p>لا توجد سجلات</p></td></tr>`;
  return list.map((l,i)=>`<tr>
    <td>${i+1}</td>
    <td><span class="badge b-info">${esc(l.userName||'-')}</span></td>
    <td><strong>${esc(l.action||'-')}</strong></td>
    <td class="text-muted" style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.details||'-')}</td>
    <td style="white-space:nowrap;font-size:12px">${fmtDateTime(l.createdAt)}</td>
  </tr>`).join('');
}
function filterActivity(){
  const uf=document.getElementById('alf').value;
  const sf=(document.getElementById('als').value||'').toLowerCase();
  const df=document.getElementById('ald').value;
  let rows=DB.all('activity').sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(uf)rows=rows.filter(r=>r.userName===uf);
  if(sf)rows=rows.filter(r=>(r.action||'').toLowerCase().includes(sf)||(r.details||'').toLowerCase().includes(sf));
  if(df)rows=rows.filter(r=>r.createdAt.slice(0,10)===df);
  document.getElementById('actTb').innerHTML=renderActRows(rows);
}
function confirmClearActivity(){
  if(!isOwner()){toast('ليس لديك صلاحية','error');return;}
  confirm2('مسح جميع سجلات النشاط؟ لا يمكن التراجع.',()=>{
    DB.set('activity',[]);logAct('مسح سجل النشاط','');toast('تم مسح السجل');renderActivity();
  });
}

/* ============================================================
   BACKUP
   ============================================================ */
function renderBackup(){
  if(!isOwner()&&!can('backup_create')){toast('هذه الصفحة للمالك الرئيسي فقط','error');navigate('dashboard');return;}
  const tables=['users','groups','projects','vehicles','tanks','tankFills','fuel','maintenance','notes','invoices','attachments','activity','drivers','fuelMovements'];
  const counts=tables.map(t=>({t,c:DB.all(t).length}));
  const totalRecs=counts.reduce((s,x)=>s+x.c,0);
  document.getElementById('pageBody').innerHTML=`
    <div class="grid-2">
      <div class="card">
        <div class="card-header"><span class="card-title">💾 إنشاء نسخة احتياطية</span></div>
        <div class="card-body">
          <p style="font-size:13px;color:var(--text-light);margin-bottom:16px">
            تنزيل نسخة احتياطية كاملة من جميع بيانات النظام بصيغة JSON.
          </p>
          <div style="background:#f8fafc;border-radius:8px;padding:12px;margin-bottom:16px">
            <div style="font-size:13px;font-weight:700;margin-bottom:8px">📊 ملخص البيانات الحالية:</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              ${counts.map(x=>`<div style="font-size:12px;color:var(--text-light)">${x.t}: <strong>${x.c}</strong></div>`).join('')}
            </div>
            <div style="margin-top:8px;font-size:13px;font-weight:700;color:var(--accent)">الإجمالي: ${totalRecs} سجل</div>
          </div>
          <button class="btn btn-primary btn-full" onclick="createBackup()">⬇️ تنزيل النسخة الاحتياطية</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">📂 استعادة نسخة احتياطية</span></div>
        <div class="card-body">
          <div style="background:#fdedec;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:var(--danger)">
            ⚠️ <strong>تحذير:</strong> سيتم استبدال جميع البيانات الحالية بالبيانات الموجودة في الملف. هذا الإجراء لا يمكن التراجع عنه.
          </div>
          <div class="upload-area" onclick="document.getElementById('bkFile').click()">
            📁 اضغط لاختيار ملف النسخة الاحتياطية (.json)
          </div>
          <input type="file" id="bkFile" accept=".json" style="display:none" onchange="restoreBackup(event)">
          <div id="bkInfo" style="margin-top:10px;font-size:13px;color:var(--text-light)"></div>
        </div>
      </div>
    </div>`;
}

function createBackup(){
  const tables=['users','groups','projects','vehicles','tanks','tankFills','fuel','maintenance','notes','invoices','attachments','activity','drivers','fuelMovements'];
  const backup={version:2,date:new Date().toISOString(),createdBy:currentUser.name,data:{}};
  tables.forEach(t=>backup.data[t]=DB.all(t));
  backup.settings=DB.cfg.get('settings')||{};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`fuel_backup_${today()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),100);
  logAct('إنشاء نسخة احتياطية',today());toast('✅ تم تنزيل النسخة الاحتياطية بنجاح');
}

function restoreBackup(e){
  const file=e.target.files[0];if(!file)return;
  document.getElementById('bkInfo').textContent='جارٍ قراءة الملف...';
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const bk=JSON.parse(ev.target.result);
      if(!bk.data)throw new Error('ملف غير صحيح');
      const totalRecs=Object.values(bk.data).reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0);
      document.getElementById('bkInfo').innerHTML=`✅ الملف صحيح — ${totalRecs} سجل — بتاريخ ${fmtDate(bk.date)} — بواسطة: ${esc(bk.createdBy||'-')}`;
      confirm2(`استعادة نسخة بتاريخ ${fmtDate(bk.date)} (${totalRecs} سجل)؟ سيتم استبدال جميع البيانات الحالية.`,()=>{
        logAct('استعادة نسخة احتياطية',bk.date||'');
        const ALLOWED=['users','groups','projects','vehicles','tanks','tankFills',
          'fuel','maintenance','notes','invoices','attachments','activity','drivers','fuelMovements'];
        ALLOWED.forEach(t=>{if(Array.isArray(bk.data[t]))DB.set(t,bk.data[t]);});
        if(bk.settings)DB.cfg.set('settings',bk.settings);
        toast('✅ تمت الاستعادة — سيتم تسجيل الخروج...');
        document.getElementById('bkFile').value='';
        setTimeout(()=>logout(),2500);
      });
    }catch(err){
      document.getElementById('bkInfo').innerHTML=`<span style="color:var(--danger)">❌ ملف غير صحيح أو تالف</span>`;
      toast('ملف النسخة غير صحيح','error');
    }
  };
  reader.onerror=()=>toast('فشل قراءة ملف النسخة الاحتياطية','error');
  reader.readAsText(file);
}

/* ============================================================
   LOGIN HANDLER
   ============================================================ */
async function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('loginBtn');
  const errEl=document.getElementById('loginError');
  btn.disabled=true;btn.textContent='جارٍ التحقق...';
  try{
    const ok=await doLogin(
      document.getElementById('li_user').value.trim(),
      document.getElementById('li_pass').value
    );
    if(ok){errEl.style.display='none';showApp();}
    else{errEl.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';errEl.style.display='block';}
  }catch{
    errEl.textContent='حدث خطأ غير متوقع — تأكد من استخدام HTTPS';errEl.style.display='block';
  }finally{
    btn.disabled=false;btn.textContent='دخول';
  }
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.getElementById('confirmOverlay').style.display==='flex')closeConfirm();
  else if(document.getElementById('modalOverlay').style.display==='flex'&&!_modalSaving)closeModal();
});
(async()=>{
  try{await initApp();}catch(e){console.warn('initApp:',e);}
  try{
    if(checkSession())showApp();
    else showLogin();
  }catch(err){
    console.error('bootstrap:',err);
    showLogin();
  }
})();
</script>
